name: 🔬 WH3000 Pro Wi-Fi 旧源码与当前源码精准差异

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    name: 🔬 Wi-Fi 源码精准差异追踪
    runs-on: ubuntu-22.04

    steps:

      # ==========================================================
      # 1. 下载 LEDE 完整 Git 历史
      # ==========================================================
      - name: "📥 下载 LEDE 完整源码历史"
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update
          sudo apt-get install -y git gawk diffutils tree

          git clone \
            --no-tags \
            https://github.com/coolsnowwolf/lede.git \
            lede

          cd lede

          echo "=========================================="
          echo "当前 LEDE"
          echo "=========================================="

          git log -1 \
            --format='Commit: %H%nDate: %ad%nSubject: %s' \
            --date=iso

      # ==========================================================
      # 2. 确认 WH3000 Pro 加入源码的提交
      # ==========================================================
      - name: "📌 确认 WH3000 Pro 历史提交"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          BASE_COMMIT="949d0bd77"

          echo "=========================================="
          echo "WH3000 Pro 基准提交"
          echo "=========================================="

          git show \
            --stat \
            --oneline \
            "${BASE_COMMIT}"

          echo
          echo "=========================================="
          echo "完整提交信息"
          echo "=========================================="

          git show \
            --format=fuller \
            --no-ext-diff \
            "${BASE_COMMIT}" \
            | head -250

      # ==========================================================
      # 3. 列出 949d0bd77 当时新增的全部文件
      # ==========================================================
      - name: "📂 查看 WH3000 Pro 初始文件"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          BASE_COMMIT="949d0bd77"

          echo "=========================================="
          echo "949d0bd77 新增文件"
          echo "=========================================="

          git diff-tree \
            --no-commit-id \
            --name-status \
            -r \
            "${BASE_COMMIT}" \
            | grep -Ei \
              'wh3000|huasifei|wifi|wireless|mt7915|mt7981|pcie|eeprom|firmware' \
            || true

      # ==========================================================
      # 4. 当前 WH3000 Pro 文件
      # ==========================================================
      - name: "📡 当前 WH3000 Pro 文件"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          echo "=========================================="
          echo "当前 WH3000 / Huasifei 文件"
          echo "=========================================="

          find target package \
            -type f \
            \( \
              -iname '*wh3000*' \
              -o -iname '*huasifei*' \
            \) \
            -print \
            2>/dev/null \
            | sort

      # ==========================================================
      # 5. 旧版本 vs 当前版本：WH3000 相关文件
      # ==========================================================
      - name: "🔎 对比 WH3000 / Huasifei 文件"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          BASE_COMMIT="949d0bd77"

          echo "=========================================="
          echo "旧版本 WH3000 / Huasifei 文件"
          echo "=========================================="

          git ls-tree \
            -r \
            --name-only \
            "${BASE_COMMIT}" \
            | grep -Ei \
              'wh3000|huasifei' \
            | sort \
            > /tmp/old_huasifei.txt \
            || true

          cat /tmp/old_huasifei.txt

          echo
          echo "=========================================="
          echo "当前 WH3000 / Huasifei 文件"
          echo "=========================================="

          find target package \
            -type f \
            -print \
            2>/dev/null \
            | grep -Ei \
              'wh3000|huasifei' \
            | sort \
            > /tmp/new_huasifei.txt \
            || true

          cat /tmp/new_huasifei.txt

          echo
          echo "=========================================="
          echo "旧版本存在、当前不存在"
          echo "=========================================="

          comm -23 \
            /tmp/old_huasifei.txt \
            /tmp/new_huasifei.txt \
            || true

      # ==========================================================
      # 6. 精准扫描 Wi-Fi 目录
      # ==========================================================
      - name: "📶 对比 Wi-Fi 相关文件"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          BASE_COMMIT="949d0bd77"

          echo "=========================================="
          echo "建立旧版本 Wi-Fi 文件列表"
          echo "=========================================="

          git ls-tree \
            -r \
            --name-only \
            "${BASE_COMMIT}" \
            | grep -Ei \
              'wifi|wireless|mt76|mt7915|mt7981|pcie|eeprom|firmware|netifd|mac80211' \
            | sort -u \
            > /tmp/old_wifi.txt

          echo "旧版本文件数量：$(wc -l < /tmp/old_wifi.txt)"

          echo
          echo "=========================================="
          echo "建立当前 Wi-Fi 文件列表"
          echo "=========================================="

          find target package \
            -type f \
            -print \
            2>/dev/null \
            | grep -Ei \
              'wifi|wireless|mt76|mt7915|mt7981|pcie|eeprom|firmware|netifd|mac80211' \
            | sort -u \
            > /tmp/new_wifi.txt

          echo "当前文件数量：$(wc -l < /tmp/new_wifi.txt)"

          echo
          echo "=========================================="
          echo "★★★★★ 旧版本有、当前没有 ★★★★★"
          echo "=========================================="

          comm -23 \
            /tmp/old_wifi.txt \
            /tmp/new_wifi.txt \
            | tee /tmp/missing_wifi.txt

          echo
          echo "疑似缺失文件数量：$(wc -l < /tmp/missing_wifi.txt)"

      # ==========================================================
      # 7. 精准扫描 MT76 / MT7915
      # ==========================================================
      - name: "🧩 对比 MT76 / MT7915 文件"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          BASE_COMMIT="949d0bd77"

          echo "=========================================="
          echo "旧版本 MT76 / MT7915"
          echo "=========================================="

          git ls-tree \
            -r \
            --name-only \
            "${BASE_COMMIT}" \
            | grep -Ei \
              'mt76|mt7915' \
            | sort -u \
            > /tmp/old_mt.txt

          cat /tmp/old_mt.txt

          echo
          echo "=========================================="
          echo "当前 MT76 / MT7915"
          echo "=========================================="

          find target package \
            -type f \
            -print \
            2>/dev/null \
            | grep -Ei \
              'mt76|mt7915' \
            | sort -u \
            > /tmp/new_mt.txt

          cat /tmp/new_mt.txt

          echo
          echo "=========================================="
          echo "★★★★★ 旧版本有、当前没有 ★★★★★"
          echo "=========================================="

          comm -23 \
            /tmp/old_mt.txt \
            /tmp/new_mt.txt \
            | tee /tmp/missing_mt.txt

      # ==========================================================
      # 8. 检查旧版本中 WH3000 Pro DTS 的内容
      # ==========================================================
      - name: "📜 对比 WH3000 Pro DTS 历史内容"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          BASE_COMMIT="949d0bd77"

          DTS="target/linux/mediatek/dts/mt7981b-huasifei-wh3000-pro.dts"

          echo "=========================================="
          echo "旧版本 DTS"
          echo "=========================================="

          git show \
            "${BASE_COMMIT}:${DTS}" \
            2>/dev/null \
            | grep -nEi \
              'wifi|pcie|mt7915|eeprom|factory|nvmem|firmware|reset|interrupt' \
            || true

          echo
          echo "=========================================="
          echo "当前 DTS"
          echo "=========================================="

          if [ -f "${DTS}" ]; then
            grep -nEi \
              'wifi|pcie|mt7915|eeprom|factory|nvmem|firmware|reset|interrupt' \
              "${DTS}" \
              || true
          fi

          echo
          echo "=========================================="
          echo "DTS 差异"
          echo "=========================================="

          git diff \
            "${BASE_COMMIT}" \
            HEAD \
            -- \
            "${DTS}" \
            || true

      # ==========================================================
      # 9. 搜索历史中可能被删除的 MT7915 / Wi-Fi 文件
      # ==========================================================
      - name: "🕵️ 搜索历史删除的 Wi-Fi 文件"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          echo "=========================================="
          echo "历史删除的 Wi-Fi 文件"
          echo "=========================================="

          git log \
            --all \
            --diff-filter=D \
            --name-only \
            --pretty=format: \
            -- \
              target/linux/mediatek \
              package/kernel/mt76 \
              package/lean/mt \
              package/firmware \
            | grep -Ei \
              'wifi|wireless|mt76|mt7915|mt7981|pcie|eeprom|firmware|wh3000|huasifei' \
            | sort -u \
            | head -500

      # ==========================================================
      # 10. 检查旧文件最后一次出现在哪个提交
      # ==========================================================
      - name: "📜 分析疑似缺失文件的 Git 历史"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          echo "=========================================="
          echo "疑似缺失文件历史"
          echo "=========================================="

          if [ -s /tmp/missing_wifi.txt ]; then

            while IFS= read -r file; do

              [ -z "${file}" ] && continue

              echo
              echo "------------------------------------------"
              echo "文件：${file}"
              echo "------------------------------------------"

              git log \
                --all \
                --follow \
                --date=short \
                --format='%h %ad %s' \
                -- \
                "${file}" \
                | head -8 \
                || true

            done < /tmp/missing_wifi.txt

          else
            echo "没有发现明显的旧 Wi-Fi 缺失文件。"
          fi

      # ==========================================================
      # 11. 搜索当前源码中的 MT7915 PCIe EEPROM
      # ==========================================================
      - name: "🎯 搜索 MT7915 PCIe EEPROM"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          echo "=========================================="
          echo "当前源码 MT7915 PCIe EEPROM"
          echo "=========================================="

          grep -RIn \
            --exclude-dir=.git \
            -E \
            'mediatek,mtd-eeprom|wifi@0,0|mt7915' \
            target/linux/mediatek/dts \
            2>/dev/null \
            | head -500 \
            || true

      # ==========================================================
      # 12. 搜索 WH3000 Pro 相关提交
      # ==========================================================
      - name: "🔍 搜索 WH3000 Pro Wi-Fi 提交"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          echo "=========================================="
          echo "WH3000 / Huasifei / MT7915 相关提交"
          echo "=========================================="

          git log \
            --all \
            --oneline \
            --date=short \
            --regexp-ignore-case \
            --grep='wh3000\|huasifei\|mt7915\|mt7981.*wifi\|wifi.*mt7981\|wifi.*pcie\|eeprom' \
            | head -300

      # ==========================================================
      # 13. 最终重点汇总
      # ==========================================================
      - name: "🚨 最终重点汇总"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          echo
          echo "=================================================="
          echo "★★★★★ WH3000 Pro Wi-Fi 源码差异最终汇总 ★★★★★"
          echo "=================================================="

          echo
          echo "【A】旧版本有、当前没有的 Wi-Fi 文件"
          echo "--------------------------------------------------"

          if [ -s /tmp/missing_wifi.txt ]; then
            cat /tmp/missing_wifi.txt
          else
            echo "未发现。"
          fi

          echo
          echo "【B】旧版本有、当前没有的 MT76 / MT7915 文件"
          echo "--------------------------------------------------"

          if [ -s /tmp/missing_mt.txt ]; then
            cat /tmp/missing_mt.txt
          else
            echo "未发现。"
          fi

          echo
          echo "【C】当前 WH3000 Pro DTS"
          echo "--------------------------------------------------"

          if [ -f target/linux/mediatek/dts/mt7981b-huasifei-wh3000-pro.dts ]; then
            echo "✅ 存在"
          else
            echo "❌ 不存在"
          fi

          echo
          echo "【D】当前 MT7915 驱动"
          echo "--------------------------------------------------"

          find package target \
            -type f \
            -iname '*mt7915*' \
            -print \
            2>/dev/null \
            | sort \
            | head -100 \
            || true

          echo
          echo "【E】当前 WH3000 Pro DTS Wi-Fi"
          echo "--------------------------------------------------"

          grep -nEi \
            'wifi|pcie|mt7915|eeprom|factory|nvmem' \
            target/linux/mediatek/dts/mt7981b-huasifei-wh3000-pro.dts \
            2>/dev/null \
            || true

          echo
          echo "=================================================="
          echo "诊断结束"
          echo "=================================================="

          echo "本工作流："
          echo "✅ 不编译固件"
          echo "✅ 不修改源码"
          echo "✅ 不修改 .config"
          echo "✅ 不修改正式工作流"
          echo "✅ 只追踪旧源码与当前源码差异"
