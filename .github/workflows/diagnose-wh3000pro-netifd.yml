name: 🔬 WH3000 Pro 最终 RootFS WiFi 诊断

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LEDE_REPO: https://github.com/coolsnowwolf/lede.git
  LEDE_BRANCH: master
  DEVICE_CONFIG: wh3000pro.config

jobs:
  diagnose:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================================
      # 1. Checkout 当前 MWRT 仓库
      # ==========================================================
      - name: "📥 获取 MWRT"
        uses: actions/checkout@v4


      # ==========================================================
      # 2. 安装基础工具
      # ==========================================================
      - name: "🧰 安装诊断工具"
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            git \
            file \
            xz-utils \
            zstd \
            gzip \
            bzip2 \
            cpio \
            squashfs-tools \
            binutils

          echo "✅ 诊断工具安装完成"


      # ==========================================================
      # 3. 拉取 LEDE
      # ==========================================================
      - name: "📥 拉取 LEDE"
        shell: bash
        run: |
          set -Eeuo pipefail

          git clone \
            --branch "${LEDE_BRANCH}" \
            --single-branch \
            "${LEDE_REPO}" \
            lede

          cd lede

          echo "=========================================="
          echo "LEDE 当前版本"
          echo "=========================================="

          git log -1 --oneline
          git rev-parse HEAD


      # ==========================================================
      # 4. 检查 WH3000 Pro 配置
      # ==========================================================
      - name: "⚙️ 检查 WH3000 Pro 配置"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          CONFIG="../${DEVICE_CONFIG}"

          if [ ! -f "${CONFIG}" ]; then
            echo "❌ 找不到 ${CONFIG}"
            exit 1
          fi

          cp "${CONFIG}" .config

          echo "=========================================="
          echo "WH3000 Pro Wi-Fi / netifd 配置"
          echo "=========================================="

          grep -E \
            '^CONFIG_PACKAGE_(netifd|wifi-scripts|kmod-mac80211|kmod-cfg80211|kmod-mt76-core|kmod-mt76-connac|kmod-mt7915e|iwinfo|rpcd-mod-iwinfo|wpad)' \
            .config \
            || true


      # ==========================================================
      # 5. 检查 netifd Makefile
      # ==========================================================
      - name: "🔎 检查 netifd Makefile"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          echo "=========================================="
          echo "netifd Makefile"
          echo "=========================================="

          NETIFD_MAKEFILE="package/network/config/netifd/Makefile"

          if [ ! -f "${NETIFD_MAKEFILE}" ]; then
            echo "❌ 找不到 ${NETIFD_MAKEFILE}"
            exit 1
          fi

          grep -n \
            -E \
            'PKG_SOURCE|PKG_SOURCE_VERSION|netifd-wireless|lib/netifd|Package/netifd' \
            "${NETIFD_MAKEFILE}" \
            || true


      # ==========================================================
      # 6. feeds
      #
      # 注意：
      # 这里采用你正式 workflow 已验证的安全方式。
      # 防止 feeds update 的 refresh_config() 改写 .config。
      # ==========================================================
      - name: "📡 更新并安装 feeds"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          echo "=========================================="
          echo "更新 feeds"
          echo "=========================================="

          cp .config .config.keep
          rm -f .config

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          mv .config.keep .config

          echo "✅ feeds 完成"


      # ==========================================================
      # 7. make defconfig
      # ==========================================================
      - name: "⚙️ 执行 make defconfig"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          make defconfig

          echo "=========================================="
          echo "defconfig 后关键配置"
          echo "=========================================="

          grep -E \
            '^CONFIG_PACKAGE_(netifd|wifi-scripts|kmod-mac80211|kmod-cfg80211|kmod-mt76-core|kmod-mt76-connac|kmod-mt7915e|iwinfo|rpcd-mod-iwinfo|wpad)' \
            .config \
            || true


      # ==========================================================
      # 8. 不编译整个固件，只准备 netifd
      # ==========================================================
      - name: "🔨 准备 netifd 编译环境"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          echo "=========================================="
          echo "准备 netifd"
          echo "=========================================="

          make package/network/config/netifd/prepare V=s

          echo
          echo "=========================================="
          echo "准备后的 netifd 源码"
          echo "=========================================="

          find build_dir \
            -type f \
            -name 'netifd-wireless.sh' \
            -print \
            2>/dev/null \
            || true


      # ==========================================================
      # 9. 直接检查 PKG_BUILD_DIR
      # ==========================================================
      - name: "🔍 检查 netifd-wireless.sh 源文件"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          echo "=========================================="
          echo "查找 netifd-wireless.sh"
          echo "=========================================="

          FOUND=0

          while IFS= read -r file; do
            FOUND=1

            echo
            echo "发现：${file}"

            echo "------------------------------------------"
            ls -l "${file}"

            echo "------------------------------------------"
            head -30 "${file}" || true

          done < <(
            find build_dir \
              -type f \
              -name 'netifd-wireless.sh' \
              2>/dev/null \
              | sort
          )

          if [ "${FOUND}" -eq 0 ]; then
            echo
            echo "❌ build_dir 中没有 netifd-wireless.sh"
          else
            echo
            echo "✅ build_dir 中存在 netifd-wireless.sh"
          fi


      # ==========================================================
      # 10. 编译 netifd 单包
      # ==========================================================
      - name: "🔨 单独编译 netifd"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          echo "=========================================="
          echo "单独编译 netifd"
          echo "=========================================="

          make package/network/config/netifd/compile V=s

          echo "✅ netifd 编译完成"


      # ==========================================================
      # 11. 检查 staging_dir
      # ==========================================================
      - name: "📦 检查 staging_dir"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          echo "=========================================="
          echo "staging_dir 中的 netifd-wireless.sh"
          echo "=========================================="

          find staging_dir \
            -type f \
            -path '*/lib/netifd/netifd-wireless.sh' \
            -print \
            2>/dev/null \
            || true

          echo
          echo "=========================================="
          echo "staging_dir 中全部 netifd 文件"
          echo "=========================================="

          find staging_dir \
            -type f \
            -path '*/lib/netifd/*' \
            -print \
            2>/dev/null \
            | sort \
            | head -300 \
            || true


      # ==========================================================
      # 12. 检查 IPK
      # ==========================================================
      - name: "📦 检查 netifd IPK"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          echo "=========================================="
          echo "寻找 netifd IPK"
          echo "=========================================="

          find bin \
            -type f \
            -name 'netifd_*.ipk' \
            -print \
            2>/dev/null \
            | sort \
            || true

          echo
          echo "=========================================="
          echo "寻找所有 netifd IPK"
          echo "=========================================="

          find . \
            -type f \
            -name 'netifd_*.ipk' \
            -print \
            2>/dev/null \
            | sort \
            || true


      # ==========================================================
      # 13. 解包 netifd IPK
      # ==========================================================
      - name: "🧪 检查 IPK 内部文件"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          IPK="$(find bin \
            -type f \
            -name 'netifd_*.ipk' \
            -print \
            2>/dev/null \
            | head -1 || true)"

          if [ -z "${IPK}" ]; then
            echo "❌ 没找到 netifd IPK"
            exit 0
          fi

          echo "=========================================="
          echo "netifd IPK"
          echo "=========================================="

          echo "${IPK}"

          rm -rf /tmp/netifd-ipk
          mkdir -p /tmp/netifd-ipk

          cd /tmp/netifd-ipk

          ar x "${GITHUB_WORKSPACE}/lede/${IPK}"

          echo
          echo "=========================================="
          echo "IPK 内容"
          echo "=========================================="

          find . \
            -type f \
            -print \
            | sort \
            | head -500

          echo
          echo "=========================================="
          echo "搜索 netifd-wireless.sh"
          echo "=========================================="

          tar_files="$(find . -type f -name 'data.tar*' | head -1 || true)"

          if [ -n "${tar_files}" ]; then
            mkdir -p extract

            case "${tar_files}" in
              *.gz)
                tar -xzf "${tar_files}" -C extract
                ;;
              *.xz)
                tar -xJf "${tar_files}" -C extract
                ;;
              *.zst)
                tar --zstd -xf "${tar_files}" -C extract
                ;;
              *.bz2)
                tar -xjf "${tar_files}" -C extract
                ;;
              *)
                tar -xf "${tar_files}" -C extract
                ;;
            esac

            find extract \
              -type f \
              -path '*/lib/netifd/*' \
              -print \
              | sort \
              || true

            echo
            echo "=========================================="
            echo "目标文件"
            echo "=========================================="

            if [ -f extract/lib/netifd/netifd-wireless.sh ]; then
              echo "✅ IPK 内包含 /lib/netifd/netifd-wireless.sh"
              ls -l extract/lib/netifd/netifd-wireless.sh
            else
              echo "❌ IPK 内没有 /lib/netifd/netifd-wireless.sh"
            fi
          fi


      # ==========================================================
      # 14. 检查 mac80211.sh
      # ==========================================================
      - name: "📡 检查 mac80211.sh"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          echo "=========================================="
          echo "mac80211.sh"
          echo "=========================================="

          find package \
            -type f \
            -path '*/lib/netifd/wireless/mac80211.sh' \
            -print \
            2>/dev/null \
            | sort \
            | while IFS= read -r file; do
                echo
                echo "文件：${file}"
                echo "------------------------------------------"
                grep -n \
                  -E \
                  'netifd-wireless|init_wireless|wifi-device|wifi-iface' \
                  "${file}" \
                  | head -100 \
                  || true
              done


      # ==========================================================
      # 15. 检查最终 package 依赖
      # ==========================================================
      - name: "🔗 检查 netifd 依赖关系"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          echo "=========================================="
          echo "netifd Package 定义"
          echo "=========================================="

          sed -n \
            '/Package\/netifd/,/Build\/Package\/netifd/p' \
            package/network/config/netifd/Makefile \
            || true


      # ==========================================================
      # 16. 模拟最终 rootfs
      # ==========================================================
      - name: "🧪 构建 netifd package install 模拟"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          echo "=========================================="
          echo "检查 package install 目录"
          echo "=========================================="

          find build_dir \
            -type d \
            -path '*/netifd*/ipkg*' \
            -print \
            2>/dev/null \
            | sort \
            | head -100 \
            || true

          echo
          echo "=========================================="
          echo "搜索安装后的 netifd-wireless.sh"
          echo "=========================================="

          find build_dir \
            -type f \
            -path '*/ipkg*/lib/netifd/netifd-wireless.sh' \
            -print \
            2>/dev/null \
            | sort \
            || true


      # ==========================================================
      # 17. 最终总结
      # ==========================================================
      - name: "📋 最终诊断总结"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          echo
          echo "============================================================"
          echo "              WH3000 PRO NETIFD 最终诊断"
          echo "============================================================"

          echo
          echo "LEDE："
          git log -1 --oneline

          echo
          echo "CONFIG_PACKAGE_netifd："
          grep '^CONFIG_PACKAGE_netifd=' .config || echo "❌ 未配置"

          echo
          echo "CONFIG_PACKAGE_wifi-scripts："
          grep '^CONFIG_PACKAGE_wifi-scripts=' .config || echo "⚠️ 未配置"

          echo
          echo "build_dir："
          if find build_dir \
            -type f \
            -name 'netifd-wireless.sh' \
            2>/dev/null \
            | grep -q .; then
            echo "✅ 存在"
          else
            echo "❌ 不存在"
          fi

          echo
          echo "staging_dir："
          if find staging_dir \
            -type f \
            -path '*/lib/netifd/netifd-wireless.sh' \
            2>/dev/null \
            | grep -q .; then
            echo "✅ 存在"
          else
            echo "❌ 不存在"
          fi

          echo
          echo "netifd IPK："
          if find bin \
            -type f \
            -name 'netifd_*.ipk' \
            2>/dev/null \
            | grep -q .; then
            echo "✅ 存在"
          else
            echo "❌ 不存在"
          fi

          echo
          echo "============================================================"
          echo "诊断完成"
          echo "============================================================"
