name: "🔬 NETIFD 最终打包诊断 v4"

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LEDE_REPO: "https://github.com/coolsnowwolf/lede.git"
  LEDE_BRANCH: "master"
  LEDE_DIR: "lede"
  CONFIG_FILE: "wh3000pro.config"

jobs:
  diagnose:
    name: "🔬 WH3000 Pro NETIFD IPK 实测"
    runs-on: ubuntu-22.04

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: "📥 Checkout MWRT-STABLE"
        uses: actions/checkout@v4

      # ==========================================================
      # 2. Runner 状态
      # ==========================================================
      - name: "🖥️ Runner 状态"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "🖥️ RUNNER 状态"
          echo "============================================================"

          echo
          echo "CPU:"
          nproc

          echo
          echo "内存:"
          free -h

          echo
          echo "磁盘:"
          df -h

          echo
          echo "系统:"
          uname -a

      # ==========================================================
      # 3. Clone LEDE
      # ==========================================================
      - name: "📦 克隆 LEDE"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "📦 克隆 LEDE"
          echo "============================================================"

          git clone \
            --depth=1 \
            --branch="${LEDE_BRANCH}" \
            "${LEDE_REPO}" \
            "${LEDE_DIR}"

          cd "${LEDE_DIR}"

          echo
          echo "LEDE commit:"
          git log -1 --oneline

      # ==========================================================
      # 4. 加载配置
      # ==========================================================
      - name: "⚙️ 加载 WH3000 Pro 配置"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${LEDE_DIR}"

          test -f "../${CONFIG_FILE}"

          cp "../${CONFIG_FILE}" .config

          echo "============================================================"
          echo "⚙️ WH3000 Pro 配置"
          echo "============================================================"

          grep -E \
            '^CONFIG_TARGET_mediatek=|^CONFIG_TARGET_mediatek_filogic=|^CONFIG_TARGET_mediatek_filogic_DEVICE_huasifei_wh3000-pro=' \
            .config || true

          echo
          echo "NETIFD / Wi-Fi:"

          grep -E \
            '^CONFIG_PACKAGE_(netifd|wifi-scripts|kmod-mac80211|kmod-cfg80211|kmod-mt76-core|kmod-mt76-connac|kmod-mt7915e|iwinfo|rpcd-mod-iwinfo)=' \
            .config || true

      # ==========================================================
      # 5. 安全 feeds
      # ==========================================================
      - name: "📡 安全更新 feeds"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${LEDE_DIR}"

          echo "============================================================"
          echo "📡 安全更新 feeds"
          echo "============================================================"

          cp .config .config.device
          rm -f .config

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          if [ -d feeds/qmodem ]; then
            ./scripts/feeds update qmodem || true
            ./scripts/feeds install -a -p qmodem || true
          fi

          mv .config.device .config

          echo
          echo "feeds 完成后配置:"

          grep -E \
            '^CONFIG_PACKAGE_(netifd|wifi-scripts|kmod-mac80211|kmod-cfg80211|kmod-mt76-core|kmod-mt76-connac|kmod-mt7915e)=' \
            .config || true

      # ==========================================================
      # 6. defconfig
      # ==========================================================
      - name: "⚙️ make defconfig"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${LEDE_DIR}"

          echo "============================================================"
          echo "⚙️ make defconfig"
          echo "============================================================"

          make defconfig

          echo
          echo "defconfig 后:"

          grep -E \
            '^CONFIG_PACKAGE_(netifd|wifi-scripts|kmod-mac80211|kmod-cfg80211|kmod-mt76-core|kmod-mt76-connac|kmod-mt7915e|iwinfo|rpcd-mod-iwinfo)=' \
            .config || true

      # ==========================================================
      # 7. 检查 netifd Makefile
      # ==========================================================
      - name: "🔎 检查 NETIFD Makefile"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${LEDE_DIR}"

          echo "============================================================"
          echo "🔎 NETIFD Makefile"
          echo "============================================================"

          grep -n \
            -C 12 \
            'netifd-wireless.sh' \
            package/network/config/netifd/Makefile \
            || true

          echo
          echo "完整 install 区域:"

          grep -n \
            -A 45 \
            '^define Package/netifd/install' \
            package/network/config/netifd/Makefile \
            || true

      # ==========================================================
      # 8. NETIFD prepare
      # ==========================================================
      - name: "📦 NETIFD prepare"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${LEDE_DIR}"

          echo "============================================================"
          echo "📦 NETIFD prepare"
          echo "============================================================"

          make package/network/config/netifd/prepare V=s

          echo
          echo "查找 netifd-wireless.sh:"

          find build_dir \
            -type f \
            -name "netifd-wireless.sh" \
            -print \
            2>/dev/null \
            || true

      # ==========================================================
      # 9. 记录 NETIFD 源码目录
      # ==========================================================
      - name: "📌 记录 NETIFD 源码"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${LEDE_DIR}"

          NETIFD_DIR="$(
            find build_dir \
              -maxdepth 3 \
              -type d \
              -name 'netifd-*' \
              -print \
              2>/dev/null \
              | head -n 1
          )"

          if [ -z "${NETIFD_DIR}" ]; then
            echo "❌ 找不到 NETIFD 源码目录"
            exit 1
          fi

          echo "NETIFD_DIR=${NETIFD_DIR}" \
            >> "${GITHUB_ENV}"

          echo "NETIFD_DIR=${NETIFD_DIR}"

          echo
          echo "脚本:"

          ls -lh \
            "${NETIFD_DIR}/scripts/" \
            2>/dev/null \
            || true

      # ==========================================================
      # 10. 检查 toolchain
      # ==========================================================
      - name: "🧰 检查 Toolchain"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${LEDE_DIR}"

          echo "============================================================"
          echo "🧰 TOOLCHAIN 检查"
          echo "============================================================"

          TOOLCHAIN_DIR="$(
            find staging_dir \
              -maxdepth 1 \
              -type d \
              -name 'toolchain-*' \
              -print \
              2>/dev/null \
              | head -n 1
          )"

          if [ -z "${TOOLCHAIN_DIR}" ]; then
            echo "TOOLCHAIN_READY=no"
            echo "⚠️ 没有找到 toolchain"
            exit 0
          fi

          echo "TOOLCHAIN_DIR=${TOOLCHAIN_DIR}"

          echo
          echo "目录:"
          ls -lah "${TOOLCHAIN_DIR}" | head -n 80

          echo
          echo "动态链接器:"
          find "${TOOLCHAIN_DIR}" \
            -type f \
            \( \
              -name 'ld-musl-*.so*' \
              -o \
              -name 'libc.so*' \
            \) \
            -print \
            2>/dev/null \
            | head -n 50 \
            || true

          if compgen -G "${TOOLCHAIN_DIR}/lib/ld-musl-*.so*" > /dev/null; then
            echo
            echo "TOOLCHAIN_DYNAMIC_LINKER=yes"
          else
            echo
            echo "TOOLCHAIN_DYNAMIC_LINKER=no"
          fi

      # ==========================================================
      # 11. 检查是否已经有 package 输出
      # ==========================================================
      - name: "📦 检查已有 NETIFD 输出"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${LEDE_DIR}"

          echo "============================================================"
          echo "📦 已有 NETIFD 输出"
          echo "============================================================"

          echo
          echo "IPK:"
          find build_dir \
            -type f \
            -iname '*netifd*.ipk' \
            -print \
            2>/dev/null \
            || true

          echo
          echo "PKGDIR:"
          find build_dir \
            -type f \
            -path '*/ipkg-*/*/lib/netifd/netifd-wireless.sh' \
            -print \
            2>/dev/null \
            || true

      # ==========================================================
      # 12. 实际构建 NETIFD package
      # ==========================================================
      - name: "🚧 实际构建 NETIFD IPK"
        id: build_netifd
        shell: bash
        continue-on-error: true
        run: |
          set -Eeuo pipefail

          cd "${LEDE_DIR}"

          echo "============================================================"
          echo "🚧 开始实际构建 NETIFD IPK"
          echo "============================================================"

          echo
          echo "注意："
          echo "这里只请求 NETIFD package。"
          echo "如果 OpenWrt 依赖链要求工具链，则记录原因后继续诊断。"
          echo

          make package/network/config/netifd/compile V=s

      # ==========================================================
      # 13. 构建结果
      # ==========================================================
      - name: "📊 NETIFD 构建结果"
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${LEDE_DIR}"

          echo "============================================================"
          echo "📊 NETIFD 构建结果"
          echo "============================================================"

          echo
          echo "IPK 文件:"

          find build_dir \
            -type f \
            -iname '*netifd*.ipk' \
            -print \
            -exec ls -lh {} \; \
            2>/dev/null \
            || true

          echo
          echo "PKGDIR 文件:"

          find build_dir \
            -type f \
            -path '*/ipkg-*/*/lib/netifd/netifd-wireless.sh' \
            -print \
            -exec ls -lh {} \; \
            2>/dev/null \
            || true

          echo
          echo "全部 netifd-wireless.sh:"

          find build_dir \
            -type f \
            -name 'netifd-wireless.sh' \
            -print \
            2>/dev/null \
            || true

      # ==========================================================
      # 14. 检查 PKGDIR 中的文件
      # ==========================================================
      - name: "🔬 检查 NETIFD PKGDIR"
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${LEDE_DIR}"

          echo "============================================================"
          echo "🔬 NETIFD PKGDIR"
          echo "============================================================"

          PKG_FILES="$(
            find build_dir \
              -type f \
              -path '*/ipkg-*/*/lib/netifd/*' \
              -print \
              2>/dev/null \
              || true
          )"

          if [ -z "${PKG_FILES}" ]; then
            echo "⚠️ 没有发现 NETIFD PKGDIR 文件"
          else
            echo "${PKG_FILES}"

            echo
            echo "重点文件:"

            while IFS= read -r file; do
              [ -z "${file}" ] && continue

              if [[ "${file}" == *"netifd-wireless.sh" ]]; then
                echo
                echo "🎯 FOUND:"
                echo "${file}"
                ls -lh "${file}"
                sha256sum "${file}"
              fi
            done <<< "${PKG_FILES}"
          fi

      # ==========================================================
      # 15. 解包 NETIFD IPK
      # ==========================================================
      - name: "📦 解包 NETIFD IPK"
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${LEDE_DIR}"

          echo "============================================================"
          echo "📦 NETIFD IPK 内容"
          echo "============================================================"

          IPK="$(
            find build_dir \
              -type f \
              -iname '*netifd*.ipk' \
              -print \
              2>/dev/null \
              | head -n 1
          )"

          if [ -z "${IPK}" ]; then
            echo "⚠️ 没有找到 NETIFD IPK"
            exit 0
          fi

          echo "IPK:"
          echo "${IPK}"

          echo
          echo "文件信息:"
          ls -lh "${IPK}"

          rm -rf tmp-netifd-ipk
          mkdir -p tmp-netifd-ipk

          tar -xf \
            "${IPK}" \
            -C tmp-netifd-ipk

          echo
          echo "IPK 全部文件:"

          find tmp-netifd-ipk \
            -type f \
            -print \
            | sort

          echo
          echo "============================================================"
          echo "🎯 检查 netifd-wireless.sh"
          echo "============================================================"

          FOUND="$(
            find tmp-netifd-ipk \
              -type f \
              -path '*/lib/netifd/netifd-wireless.sh' \
              -print \
              2>/dev/null \
              || true
          )"

          if [ -n "${FOUND}" ]; then
            echo "✅ IPK 中存在:"
            echo "${FOUND}"

            while IFS= read -r file; do
              [ -z "${file}" ] && continue

              ls -lh "${file}"
              sha256sum "${file}"
            done <<< "${FOUND}"
          else
            echo "❌ IPK 中不存在:"
            echo "/lib/netifd/netifd-wireless.sh"
          fi

      # ==========================================================
      # 16. 检查 netifd package manifest
      # ==========================================================
      - name: "📜 检查 NETIFD Manifest"
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${LEDE_DIR}"

          echo "============================================================"
          echo "📜 NETIFD Manifest"
          echo "============================================================"

          find bin \
            -type f \
            -iname '*netifd*.manifest' \
            -print \
            -exec sed -n '1,160p' {} \; \
            2>/dev/null \
            || true

          echo
          echo "Package metadata:"

          find build_dir \
            -type f \
            \( \
              -name '*.control' \
              -o \
              -name '*.list' \
            \) \
            -path '*netifd*' \
            -print \
            2>/dev/null \
            | head -n 100 \
            || true

      # ==========================================================
      # 17. 最终自动判断
      # ==========================================================
      - name: "🧠 最终自动判断"
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${LEDE_DIR}"

          echo
          echo "============================================================"
          echo "🧠 NETIFD v4 最终判断"
          echo "============================================================"

          SCRIPT_COUNT="$(
            find build_dir \
              -type f \
              -name 'netifd-wireless.sh' \
              2>/dev/null \
              | wc -l
          )"

          PKG_SCRIPT_COUNT="$(
            find build_dir \
              -type f \
              -path '*/ipkg-*/*/lib/netifd/netifd-wireless.sh' \
              2>/dev/null \
              | wc -l
          )"

          IPK_COUNT="$(
            find build_dir \
              -type f \
              -iname '*netifd*.ipk' \
              2>/dev/null \
              | wc -l
          )"

          IPK_SCRIPT_COUNT="$(
            if [ -d tmp-netifd-ipk ]; then
              find tmp-netifd-ipk \
                -type f \
                -path '*/lib/netifd/netifd-wireless.sh' \
                2>/dev/null \
                | wc -l
            else
              echo 0
            fi
          )"

          echo
          echo "源码 netifd-wireless.sh：${SCRIPT_COUNT}"
          echo "PKGDIR netifd-wireless.sh：${PKG_SCRIPT_COUNT}"
          echo "NETIFD IPK：${IPK_COUNT}"
          echo "IPK 内 netifd-wireless.sh：${IPK_SCRIPT_COUNT}"

          echo
          echo "------------------------------------------------------------"

          if [ "${SCRIPT_COUNT}" -eq 0 ]; then

            echo "❌ 结论：NETIFD 源码阶段就没有 netifd-wireless.sh。"
            echo "重点：source / prepare / patch"

          elif [ "${PKG_SCRIPT_COUNT}" -gt 0 ] && [ "${IPK_SCRIPT_COUNT}" -gt 0 ]; then

            echo "✅ 结论：NETIFD package 完整。"
            echo
            echo "netifd-wireless.sh 已经进入 IPK。"
            echo
            echo "下一阶段应该检查："
            echo "最终固件 package selection / rootfs 安装。"

          elif [ "${PKG_SCRIPT_COUNT}" -gt 0 ] && [ "${IPK_SCRIPT_COUNT}" -eq 0 ]; then

            echo "⚠️ 结论：NETIFD PKGDIR 有文件，但 IPK 没包含。"
            echo
            echo "重点：IPK 打包阶段。"

          elif [ "${SCRIPT_COUNT}" -gt 0 ] && [ "${PKG_SCRIPT_COUNT}" -eq 0 ]; then

            echo "⚠️ 结论：NETIFD 源码有文件，但没有进入 PKGDIR。"
            echo
            echo "重点：Package/netifd/install 阶段。"

          else

            echo "⚠️ 结论：当前没有获得完整 package 输出。"
            echo
            echo "需要结合上面的 NETIFD compile 日志判断是否被 toolchain 阻断。"

          fi

          echo
          echo "============================================================"
          echo "🏁 NETIFD v4 诊断结束"
          echo "============================================================"
