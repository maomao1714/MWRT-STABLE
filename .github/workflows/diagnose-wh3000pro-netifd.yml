name: 🔬 WH3000 Pro netifd WiFi 安装链诊断 V2

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LEDE_REPO: https://github.com/coolsnowwolf/lede.git
  LEDE_BRANCH: master
  DEVICE_CONFIG: wh3000pro.config

jobs:
  diagnose:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================================
      # 1. 获取 MWRT
      # ==========================================================
      - name: "📥 获取当前 MWRT"
        uses: actions/checkout@v4


      # ==========================================================
      # 2. 拉取 LEDE
      # ==========================================================
      - name: "📥 拉取 LEDE"
        shell: bash
        run: |
          set -Eeuo pipefail

          git clone \
            --branch "${LEDE_BRANCH}" \
            --single-branch \
            "${LEDE_REPO}" \
            lede

          cd lede

          echo "=========================================="
          echo "LEDE 当前版本"
          echo "=========================================="

          git log -1 --oneline
          git rev-parse HEAD


      # ==========================================================
      # 3. 加载 WH3000 Pro 配置
      # ==========================================================
      - name: "⚙️ 加载 WH3000 Pro 配置"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          if [ ! -f "../${DEVICE_CONFIG}" ]; then
            echo "❌ 找不到 ../${DEVICE_CONFIG}"
            exit 1
          fi

          cp "../${DEVICE_CONFIG}" .config

          echo "=========================================="
          echo "原始 WH3000 Pro 配置"
          echo "=========================================="

          grep -E \
            '^CONFIG_PACKAGE_(netifd|wifi-scripts|kmod-cfg80211|kmod-mac80211|kmod-mt76-core|kmod-mt76-connac|kmod-mt7915e|iwinfo|rpcd-mod-iwinfo|wpad)' \
            .config \
            || true


      # ==========================================================
      # 4. feeds
      #
      # 保护 .config，防止 feeds update 的 refresh_config()
      # 把设备配置提前清掉。
      # ==========================================================
      - name: "📡 更新并安装 feeds"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          echo "=========================================="
          echo "更新 feeds"
          echo "=========================================="

          cp .config .config.keep
          rm -f .config

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          mv .config.keep .config

          echo "✅ feeds 完成"


      # ==========================================================
      # 5. defconfig
      # ==========================================================
      - name: "⚙️ 执行 defconfig"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          make defconfig

          echo "=========================================="
          echo "defconfig 后 WiFi/netifd 配置"
          echo "=========================================="

          grep -E \
            '^CONFIG_PACKAGE_(netifd|wifi-scripts|kmod-cfg80211|kmod-mac80211|kmod-mt76-core|kmod-mt76-connac|kmod-mt7915e|iwinfo|rpcd-mod-iwinfo|wpad)' \
            .config \
            || true


      # ==========================================================
      # 6. 检查 netifd Makefile
      # ==========================================================
      - name: "🔎 检查 netifd Makefile"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          FILE="package/network/config/netifd/Makefile"

          echo "=========================================="
          echo "netifd Makefile"
          echo "=========================================="

          sed -n '1,260p' "${FILE}"

          echo
          echo "=========================================="
          echo "netifd-wireless.sh 引用"
          echo "=========================================="

          grep -n \
            -E \
            'netifd-wireless|lib/netifd|Package/netifd' \
            "${FILE}" \
            || true


      # ==========================================================
      # 7. 检查 wifi-scripts Makefile
      # ==========================================================
      - name: "📦 检查 wifi-scripts Makefile"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          FILE="package/network/config/wifi-scripts/Makefile"

          echo "=========================================="
          echo "wifi-scripts Makefile"
          echo "=========================================="

          if [ -f "${FILE}" ]; then
            sed -n '1,260p' "${FILE}"
          else
            echo "❌ 当前 LEDE 没有 package/network/config/wifi-scripts/Makefile"
          fi


      # ==========================================================
      # 8. 检查 wifi-scripts 文件
      # ==========================================================
      - name: "🔎 检查 wifi-scripts files"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          echo "=========================================="
          echo "wifi-scripts files"
          echo "=========================================="

          find package/network/config/wifi-scripts \
            -type f \
            -print \
            2>/dev/null \
            | sort \
            || true

          echo
          echo "=========================================="
          echo "搜索 netifd-wireless.sh"
          echo "=========================================="

          find package/network/config/wifi-scripts \
            -type f \
            -name 'netifd-wireless.sh' \
            -print \
            2>/dev/null \
            || true


      # ==========================================================
      # 9. 检查 netifd 源码
      # ==========================================================
      - name: "📥 准备 netifd 源码"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          echo "=========================================="
          echo "执行 netifd prepare"
          echo "=========================================="

          make package/network/config/netifd/prepare V=s

          echo
          echo "=========================================="
          echo "netifd-wireless.sh"
          echo "=========================================="

          find build_dir \
            -type f \
            -name 'netifd-wireless.sh' \
            -print \
            2>/dev/null \
            | sort \
            || true


      # ==========================================================
      # 10. 检查 netifd 源码中的所有 scripts
      # ==========================================================
      - name: "📂 检查 netifd scripts"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          echo "=========================================="
          echo "netifd scripts"
          echo "=========================================="

          find build_dir \
            -type f \
            -path '*/netifd-*/scripts/*' \
            -print \
            2>/dev/null \
            | sort \
            | head -300 \
            || true


      # ==========================================================
      # 11. 检查所有安装规则
      # ==========================================================
      - name: "🔍 全源码追踪安装来源"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          echo "=========================================="
          echo "全源码搜索 netifd-wireless.sh"
          echo "=========================================="

          grep -R \
            -n \
            --exclude-dir=.git \
            --exclude='*.patch' \
            "netifd-wireless.sh" \
            package \
            target \
            feeds \
            2>/dev/null \
            | head -500 \
            || true

          echo
          echo "=========================================="
          echo "全源码搜索 lib/netifd/netifd-wireless"
          echo "=========================================="

          grep -R \
            -n \
            --exclude-dir=.git \
            "lib/netifd/netifd-wireless" \
            package \
            target \
            feeds \
            2>/dev/null \
            | head -500 \
            || true


      # ==========================================================
      # 12. 检查 mac80211 安装规则
      # ==========================================================
      - name: "📡 检查 mac80211 安装文件"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          echo "=========================================="
          echo "mac80211 wireless scripts"
          echo "=========================================="

          find package/kernel/mac80211 \
            -type f \
            -path '*/lib/netifd/wireless/*' \
            -print \
            2>/dev/null \
            | sort \
            || true

          echo
          echo "=========================================="
          echo "mac80211.sh"
          echo "=========================================="

          find package/kernel/mac80211 \
            -type f \
            -name 'mac80211.sh' \
            -print \
            2>/dev/null \
            | sort \
            | while IFS= read -r file; do
                echo
                echo "FILE: ${file}"
                echo "------------------------------------------"
                grep -n \
                  -E \
                  'netifd-wireless|init_wireless|wifi-device|wifi-iface' \
                  "${file}" \
                  || true
              done


      # ==========================================================
      # 13. 检查 package metadata
      # ==========================================================
      - name: "📋 检查 package metadata"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          echo "=========================================="
          echo "netifd package metadata"
          echo "=========================================="

          grep -R \
            -n \
            -E \
            '^Package: netifd$|^Package: wifi-scripts$' \
            tmp \
            bin \
            build_dir \
            staging_dir \
            2>/dev/null \
            | head -300 \
            || true


      # ==========================================================
      # 14. 仅执行 package install 目标
      #
      # 关键：
      # 不执行 compile。
      # 直接执行 install，避免再次触发 toolchain。
      # ==========================================================
      - name: "🧪 检查 netifd install 目录"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          echo "=========================================="
          echo "搜索已有 ipkg / pkgdir"
          echo "=========================================="

          find build_dir \
            -type d \
            \( \
              -name 'netifd*ipkg*' \
              -o -name 'netifd*pkgdir*' \
              -o -name 'wifi-scripts*ipkg*' \
              -o -name 'wifi-scripts*pkgdir*' \
            \) \
            -print \
            2>/dev/null \
            | sort \
            | head -300 \
            || true


      # ==========================================================
      # 15. 检查 staging_dir 中现有文件
      # ==========================================================
      - name: "📦 检查 staging_dir"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          echo "=========================================="
          echo "staging_dir/lib/netifd"
          echo "=========================================="

          find staging_dir \
            -type f \
            -path '*/lib/netifd/*' \
            -print \
            2>/dev/null \
            | sort \
            | head -500 \
            || true

          echo
          echo "=========================================="
          echo "目标文件"
          echo "=========================================="

          find staging_dir \
            -type f \
            -path '*/lib/netifd/netifd-wireless.sh' \
            -print \
            2>/dev/null \
            || true


      # ==========================================================
      # 16. 检查最终可能存在的 rootfs
      # ==========================================================
      - name: "🧱 检查已有 rootfs"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          echo "=========================================="
          echo "搜索 rootfs"
          echo "=========================================="

          find build_dir \
            -type d \
            \( \
              -name 'root-*' \
              -o -name '*rootfs*' \
            \) \
            -print \
            2>/dev/null \
            | sort \
            | head -200 \
            || true

          echo
          echo "=========================================="
          echo "rootfs 中的 netifd-wireless.sh"
          echo "=========================================="

          find build_dir \
            -type f \
            -path '*/root-*/lib/netifd/netifd-wireless.sh' \
            -print \
            2>/dev/null \
            || true


      # ==========================================================
      # 17. 检查最终固件目录
      # ==========================================================
      - name: "📦 检查固件输出目录"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          echo "=========================================="
          echo "bin/targets"
          echo "=========================================="

          if [ -d bin/targets ]; then
            find bin/targets \
              -maxdepth 5 \
              -type f \
              -print \
              | sort \
              | head -300
          else
            echo "当前诊断没有执行完整固件编译，因此 bin/targets 不存在是正常的。"
          fi


      # ==========================================================
      # 18. 最终自动判断
      # ==========================================================
      - name: "🧠 自动分析结果"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd lede

          echo
          echo "============================================================"
          echo "             WH3000 PRO NETIFD 自动诊断"
          echo "============================================================"

          echo
          echo "【1】netifd 配置"
          grep '^CONFIG_PACKAGE_netifd=' .config || echo "❌ netifd 未配置"

          echo
          echo "【2】wifi-scripts 配置"
          grep '^CONFIG_PACKAGE_wifi-scripts=' .config || echo "⚠️ wifi-scripts 未配置"

          echo
          echo "【3】netifd-wireless.sh 源码"
          if find build_dir \
            -type f \
            -name 'netifd-wireless.sh' \
            2>/dev/null \
            | grep -q .; then
            echo "✅ netifd 源码包含 netifd-wireless.sh"
          else
            echo "❌ netifd 源码没有 netifd-wireless.sh"
          fi

          echo
          echo "【4】staging_dir"
          if find staging_dir \
            -type f \
            -path '*/lib/netifd/netifd-wireless.sh' \
            2>/dev/null \
            | grep -q .; then
            echo "✅ staging_dir 已存在"
          else
            echo "❌ staging_dir 没有"
          fi

          echo
          echo "【5】rootfs"
          if find build_dir \
            -type f \
            -path '*/root-*/lib/netifd/netifd-wireless.sh' \
            2>/dev/null \
            | grep -q .; then
            echo "✅ rootfs 已存在"
          else
            echo "⚠️ 当前诊断没有完整编译 rootfs，不能仅凭这里判定"
          fi

          echo
          echo "============================================================"
          echo "自动诊断结束"
          echo "============================================================"

          echo
          echo "下一步判断规则："
          echo
          echo "A. build_dir 有，staging_dir 没有"
          echo "   -> 重点查 netifd package install"
          echo
          echo "B. staging_dir 有"
          echo "   -> netifd 本身基本正常，继续查最终 rootfs/package selection"
          echo
          echo "C. build_dir 都没有"
          echo "   -> netifd prepare/source 获取异常"
          echo
          echo "D. wifi-scripts 有 netifd-wireless.sh"
          echo "   -> 应优先修复 wifi-scripts/package 选择"
          echo
          echo "E. wifi-scripts 没有，但 netifd 有"
          echo "   -> 继续根据 Makefile 的实际安装规则判断"
          echo
          echo "============================================================"
