name: "🔎 NETIFD 最终打包诊断 v3"

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LEDE_REPO: "https://github.com/coolsnowwolf/lede.git"
  LEDE_BRANCH: "master"
  LEDE_DIR: "lede"
  CONFIG_FILE: "wh3000pro.config"

jobs:
  diagnose:
    name: "🔎 WH3000 Pro NETIFD 打包链诊断"
    runs-on: ubuntu-22.04

    steps:

      # ==========================================================
      # 1. Checkout MWRT-STABLE
      # ==========================================================
      - name: "📥 Checkout MWRT-STABLE"
        uses: actions/checkout@v4

      # ==========================================================
      # 2. Runner 基础信息
      # ==========================================================
      - name: "🖥️ Runner 状态"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "🖥️ Runner 状态"
          echo "=========================================="

          uname -a
          echo

          echo "CPU:"
          nproc
          echo

          echo "内存:"
          free -h
          echo

          echo "磁盘:"
          df -h
          echo

          echo "工作目录:"
          pwd
          ls -lah

      # ==========================================================
      # 3. 克隆 LEDE
      # ==========================================================
      - name: "📦 克隆 LEDE"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "📦 克隆 LEDE"
          echo "=========================================="

          git clone \
            --depth=1 \
            --branch="${LEDE_BRANCH}" \
            "${LEDE_REPO}" \
            "${LEDE_DIR}"

          cd "${LEDE_DIR}"

          echo
          echo "LEDE commit:"
          git log -1 --oneline

          echo
          echo "LEDE branch:"
          git branch --show-current

      # ==========================================================
      # 4. 检查配置文件
      # ==========================================================
      - name: "📋 检查 WH3000 Pro 配置"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "📋 检查 WH3000 Pro 配置"
          echo "=========================================="

          test -f "${CONFIG_FILE}"

          echo "配置文件：${CONFIG_FILE}"
          echo

          grep -E \
            '^CONFIG_TARGET_mediatek=|^CONFIG_TARGET_mediatek_filogic=|^CONFIG_TARGET_mediatek_filogic_DEVICE_huasifei_wh3000-pro=' \
            "${CONFIG_FILE}" || true

          echo
          echo "NETIFD:"
          grep -E \
            '^CONFIG_PACKAGE_netifd=' \
            "${CONFIG_FILE}" || true

          echo
          echo "Wi-Fi:"
          grep -E \
            '^CONFIG_PACKAGE_(wifi-scripts|kmod-mac80211|kmod-cfg80211|kmod-mt76-core|kmod-mt76-connac|kmod-mt7915e|iwinfo|rpcd-mod-iwinfo)=' \
            "${CONFIG_FILE}" || true

      # ==========================================================
      # 5. 加载配置
      # ==========================================================
      - name: "⚙️ 加载 WH3000 Pro 配置"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${LEDE_DIR}"

          cp "../${CONFIG_FILE}" .config

          echo "=========================================="
          echo "⚙️ 当前 .config"
          echo "=========================================="

          grep -E \
            '^CONFIG_PACKAGE_(netifd|wifi-scripts|kmod-mac80211|kmod-cfg80211|kmod-mt76-core|kmod-mt76-connac|kmod-mt7915e|iwinfo|rpcd-mod-iwinfo)=' \
            .config || true

      # ==========================================================
      # 6. 安全更新 feeds
      # ==========================================================
      - name: "📡 安全更新并安装 feeds"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${LEDE_DIR}"

          echo "=========================================="
          echo "📡 安全更新并安装 feeds"
          echo "=========================================="

          cp .config .config.device
          rm -f .config

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          if [ -d feeds/qmodem ]; then
            ./scripts/feeds update qmodem || true
            ./scripts/feeds install -a -p qmodem || true
          fi

          mv .config.device .config

          echo
          echo "===== feeds 后配置 ====="

          grep -E \
            '^CONFIG_PACKAGE_(netifd|wifi-scripts|luci-theme-design|docker|dockerd|lucky|qmodem|luci-app-qmodem-next)=' \
            .config || true

      # ==========================================================
      # 7. 检查 Makefile
      # ==========================================================
      - name: "🔬 检查 NETIFD / WIFI-SCRIPTS Makefile"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${LEDE_DIR}"

          echo "=========================================="
          echo "🔬 NETIFD Makefile"
          echo "=========================================="

          sed -n '1,180p' \
            package/network/config/netifd/Makefile

          echo
          echo "=========================================="
          echo "🔬 WIFI-SCRIPTS Makefile"
          echo "=========================================="

          if [ -f package/network/config/wifi-scripts/Makefile ]; then
            sed -n '1,220p' \
              package/network/config/wifi-scripts/Makefile
          else
            echo "⚠️ 当前源码没有 wifi-scripts Makefile"
          fi

      # ==========================================================
      # 8. make defconfig
      # ==========================================================
      - name: "⚙️ 执行 make defconfig"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${LEDE_DIR}"

          echo "=========================================="
          echo "⚙️ make defconfig"
          echo "=========================================="

          make defconfig

          echo
          echo "===== defconfig 后 ====="

          grep -E \
            '^CONFIG_PACKAGE_(netifd|wifi-scripts|kmod-mac80211|kmod-cfg80211|kmod-mt76-core|kmod-mt76-connac|kmod-mt7915e|iwinfo|rpcd-mod-iwinfo)=' \
            .config || true

      # ==========================================================
      # 9. NETIFD prepare
      # ==========================================================
      - name: "📦 NETIFD prepare"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${LEDE_DIR}"

          echo "=========================================="
          echo "📦 NETIFD prepare"
          echo "=========================================="

          make package/network/config/netifd/prepare V=s

          echo
          echo "===== 查找 netifd-wireless.sh ====="

          find build_dir \
            -type f \
            -name "netifd-wireless.sh" \
            -print 2>/dev/null || true

      # ==========================================================
      # 10. 检查 prepare 后脚本
      # ==========================================================
      - name: "🔎 检查 NETIFD 脚本"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${LEDE_DIR}"

          echo "=========================================="
          echo "🔎 NETIFD 脚本"
          echo "=========================================="

          NETIFD_SCRIPT="$(
            find build_dir \
              -type f \
              -path "*/netifd-*/scripts/netifd-wireless.sh" \
              -print \
              2>/dev/null | head -n 1
          )"

          if [ -z "${NETIFD_SCRIPT}" ]; then
            echo "❌ 找不到 netifd-wireless.sh"
            exit 1
          fi

          echo "找到："
          echo "${NETIFD_SCRIPT}"

          echo
          echo "文件信息:"
          ls -lh "${NETIFD_SCRIPT}"

          echo
          echo "SHA256:"
          sha256sum "${NETIFD_SCRIPT}"

          echo
          echo "前 30 行:"
          sed -n '1,30p' "${NETIFD_SCRIPT}"

          echo
          echo "=========================================="
          echo "📌 netifd Makefile 安装规则"
          echo "=========================================="

          grep -n -C 8 \
            'netifd-wireless.sh' \
            package/network/config/netifd/Makefile || true

      # ==========================================================
      # 11. 检查 mac80211 是否调用该文件
      # ==========================================================
      - name: "📡 检查 mac80211 依赖"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${LEDE_DIR}"

          echo "=========================================="
          echo "📡 检查 mac80211.sh"
          echo "=========================================="

          MAC80211_FILES="$(
            find package \
              -type f \
              -path "*/lib/netifd/wireless/mac80211.sh" \
              -print \
              2>/dev/null || true
          )"

          echo "${MAC80211_FILES}"

          while IFS= read -r file; do
            [ -z "${file}" ] && continue

            echo
            echo "----- ${file} -----"

            grep -n \
              'netifd-wireless.sh' \
              "${file}" || true

          done <<< "${MAC80211_FILES}"

      # ==========================================================
      # 12. 判断工具链是否已经存在
      # ==========================================================
      - name: "🧰 检查工具链状态"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${LEDE_DIR}"

          echo "=========================================="
          echo "🧰 工具链状态"
          echo "=========================================="

          TOOLCHAIN_DIR="$(
            find staging_dir \
              -maxdepth 1 \
              -type d \
              -name 'toolchain-*' \
              -print \
              2>/dev/null | head -n 1
          )"

          if [ -z "${TOOLCHAIN_DIR}" ]; then
            echo "TOOLCHAIN_READY=no"
            echo "⚠️ 当前 Runner 没有已经准备好的 toolchain"
          else
            echo "TOOLCHAIN_READY=yes"
            echo "工具链目录：${TOOLCHAIN_DIR}"

            if compgen -G "${TOOLCHAIN_DIR}/lib/ld-musl-*.so*" > /dev/null; then
              echo "动态链接器存在"
            else
              echo "⚠️ 动态链接器缺失"
            fi
          fi

      # ==========================================================
      # 13. 只做 Makefile install 规则模拟
      # ==========================================================
      - name: "🧪 模拟 NETIFD 安装路径"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${LEDE_DIR}"

          echo "=========================================="
          echo "🧪 模拟 NETIFD 安装路径"
          echo "=========================================="

          NETIFD_SCRIPT="$(
            find build_dir \
              -type f \
              -path "*/netifd-*/scripts/netifd-wireless.sh" \
              -print \
              2>/dev/null | head -n 1
          )"

          if [ -z "${NETIFD_SCRIPT}" ]; then
            echo "❌ 没有找到 netifd-wireless.sh"
            exit 1
          fi

          TEST_ROOT="${PWD}/tmp-netifd-install"
          rm -rf "${TEST_ROOT}"

          mkdir -p "${TEST_ROOT}/lib/netifd"

          cp "${NETIFD_SCRIPT}" \
            "${TEST_ROOT}/lib/netifd/netifd-wireless.sh"

          chmod 0755 \
            "${TEST_ROOT}/lib/netifd/netifd-wireless.sh"

          echo
          echo "模拟安装结果："

          find "${TEST_ROOT}" \
            -type f \
            -ls

          echo
          echo "文件："

          ls -lh \
            "${TEST_ROOT}/lib/netifd/netifd-wireless.sh"

          echo
          echo "SHA256："

          sha256sum \
            "${TEST_ROOT}/lib/netifd/netifd-wireless.sh"

      # ==========================================================
      # 14. 检查当前是否已经存在 ipkg/pkgdir
      # ==========================================================
      - name: "📦 检查已有 IPKG / PKGDIR"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${LEDE_DIR}"

          echo "=========================================="
          echo "📦 查找 netifd package 输出"
          echo "=========================================="

          echo
          echo "IPKG:"
          find build_dir \
            -type f \
            -iname '*netifd*.ipk' \
            -print \
            2>/dev/null || true

          echo
          echo "PKGDIR:"
          find build_dir \
            -type f \
            -path '*/ipkg-*/*/lib/netifd/netifd-wireless.sh' \
            -print \
            2>/dev/null || true

          echo
          echo "所有 netifd-wireless.sh:"
          find build_dir \
            -type f \
            -name 'netifd-wireless.sh' \
            -print \
            2>/dev/null || true

      # ==========================================================
      # 15. 如果已有 IPK，直接解包检查
      # ==========================================================
      - name: "📦 解包已有 NETIFD IPK"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${LEDE_DIR}"

          echo "=========================================="
          echo "📦 解包 NETIFD IPK"
          echo "=========================================="

          IPK="$(
            find build_dir \
              -type f \
              -iname '*netifd*.ipk' \
              -print \
              2>/dev/null | head -n 1
          )"

          if [ -z "${IPK}" ]; then
            echo "⚠️ 当前诊断没有现成 NETIFD IPK"
            echo "这是正常的，因为本诊断没有强制启动完整工具链编译。"
            exit 0
          fi

          echo "找到 IPK:"
          echo "${IPK}"

          rm -rf tmp-netifd-ipk
          mkdir -p tmp-netifd-ipk

          tar -xf "${IPK}" \
            -C tmp-netifd-ipk

          echo
          echo "IPK 内容:"
          find tmp-netifd-ipk \
            -type f \
            -print

          echo
          echo "检查 netifd-wireless.sh:"

          find tmp-netifd-ipk \
            -type f \
            -path '*/lib/netifd/netifd-wireless.sh' \
            -ls \
            2>/dev/null || true

      # ==========================================================
      # 16. 检查最终固件输出
      # ==========================================================
      - name: "💿 检查最终固件 RootFS"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${LEDE_DIR}"

          echo "=========================================="
          echo "💿 检查最终固件 RootFS"
          echo "=========================================="

          if [ -d bin/targets ]; then
            echo "发现 bin/targets:"
            find bin/targets \
              -maxdepth 5 \
              -type f \
              -print \
              2>/dev/null || true
          else
            echo "⚠️ 当前诊断没有生成最终固件"
            echo "因此这里不会有 rootfs。"
          fi

      # ==========================================================
      # 17. 全源码依赖关系
      # ==========================================================
      - name: "🔗 全源码搜索 NETIFD-WIRELESS"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${LEDE_DIR}"

          echo "=========================================="
          echo "🔗 全源码搜索 netifd-wireless.sh"
          echo "=========================================="

          grep -R \
            -n \
            --exclude-dir=.git \
            --exclude='*.o' \
            --exclude='*.a' \
            'netifd-wireless.sh' \
            package \
            target \
            include \
            scripts \
            2>/dev/null \
            | head -n 200 \
            || true

      # ==========================================================
      # 18. 最终自动分析
      # ==========================================================
      - name: "🧠 自动分析诊断结果"
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${LEDE_DIR}"

          echo
          echo "============================================================"
          echo "🧠 NETIFD 最终诊断结论"
          echo "============================================================"

          echo
          echo "【1】配置："
          grep -E \
            '^CONFIG_PACKAGE_(netifd|wifi-scripts)=' \
            .config \
            || true

          echo
          echo "【2】源码："

          SCRIPT_COUNT="$(
            find build_dir \
              -type f \
              -name 'netifd-wireless.sh' \
              2>/dev/null | wc -l
          )"

          echo "netifd-wireless.sh 数量：${SCRIPT_COUNT}"

          echo
          echo "【3】IPK："

          IPK_COUNT="$(
            find build_dir \
              -type f \
              -iname '*netifd*.ipk' \
              2>/dev/null | wc -l
          )"

          echo "NETIFD IPK 数量：${IPK_COUNT}"

          echo
          echo "【4】PKGDIR："

          PKG_COUNT="$(
            find build_dir \
              -type f \
              -path '*/ipkg-*/*/lib/netifd/netifd-wireless.sh' \
              2>/dev/null | wc -l
          )"

          echo "PKGDIR 中 netifd-wireless.sh：${PKG_COUNT}"

          echo
          echo "============================================================"

          if [ "${SCRIPT_COUNT}" -gt 0 ] && [ "${PKG_COUNT}" -gt 0 ]; then
            echo "✅ 已经确认：netifd-wireless.sh 进入了 NETIFD package 目录。"
            echo
            echo "下一步重点检查："
            echo "NETIFD IPK 是否进入最终固件。"

          elif [ "${SCRIPT_COUNT}" -gt 0 ] && [ "${PKG_COUNT}" -eq 0 ]; then
            echo "⚠️ 已确认源码存在，但当前没有进入 NETIFD package 目录。"
            echo
            echo "这时重点检查："
            echo "NETIFD install/package 阶段。"

          elif [ "${SCRIPT_COUNT}" -eq 0 ]; then
            echo "❌ prepare 阶段就没有 netifd-wireless.sh。"
            echo
            echo "重点检查："
            echo "NETIFD 源码下载 / 解压 / patch。"

          else
            echo "⚠️ 当前诊断没有足够的 package 输出。"
          fi

          echo
          echo "============================================================"
          echo "🏁 v3 诊断结束"
          echo "============================================================"
