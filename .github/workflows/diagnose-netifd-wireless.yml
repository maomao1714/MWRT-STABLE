name: "🔬 最终诊断 Netifd → IPK → Rootfs"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04

    env:
      LEDE_DIR: lede
      CONFIG_FILE: wh3000pro.config

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: "📥 Checkout MWRT-STABLE"
        uses: actions/checkout@v4

      # ==========================================================
      # 2. Clone LEDE
      # ==========================================================
      - name: "📦 Clone LEDE"
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf "${LEDE_DIR}"

          git clone \
            --depth=1 \
            --branch master \
            https://github.com/coolsnowwolf/lede.git \
            "${LEDE_DIR}"

          cd "${LEDE_DIR}"

          echo "=========================================="
          echo "LEDE commit"
          echo "=========================================="

          git log -1 --oneline

      # ==========================================================
      # 3. 加载 WH3000 Pro 配置
      # ==========================================================
      - name: "📄 加载 WH3000 Pro 配置"
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f "${CONFIG_FILE}"

          cp "${CONFIG_FILE}" "${LEDE_DIR}/.config"

          cd "${LEDE_DIR}"

          echo "=========================================="
          echo "目标设备"
          echo "=========================================="

          grep -E \
            '^CONFIG_TARGET_mediatek|^CONFIG_TARGET_PROFILE' \
            .config \
            || true

      # ==========================================================
      # 4. 安全 feeds
      # ==========================================================
      - name: "📡 更新 feeds（保护 .config）"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${LEDE_DIR}"

          cp .config .config.device
          rm -f .config

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          mv .config.device .config

          echo "feeds 完成"

      # ==========================================================
      # 5. defconfig
      # ==========================================================
      - name: "⚙️ 生成最终配置"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${LEDE_DIR}"

          make defconfig

          echo
          echo "=========================================="
          echo "Netifd 配置"
          echo "=========================================="

          grep -E \
            '^CONFIG_PACKAGE_netifd=' \
            .config \
            || true

      # ==========================================================
      # 6. 静态确认 netifd 安装规则
      # ==========================================================
      - name: "🔎 分析 Netifd 安装规则"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${LEDE_DIR}"

          echo
          echo "=================================================="
          echo "NETIFD MAKEFILE"
          echo "=================================================="

          grep -n -A35 -B10 \
            'define Package/netifd/install' \
            package/network/config/netifd/Makefile \
            || true

          echo
          echo "=================================================="
          echo "netifd-wireless.sh 所有源码位置"
          echo "=================================================="

          find build_dir package \
            -type f \
            -name 'netifd-wireless.sh' \
            2>/dev/null \
            | sort \
            || true

          echo
          echo "=================================================="
          echo "netifd-wireless.sh 所有引用"
          echo "=================================================="

          grep -Rni \
            'netifd-wireless.sh' \
            package/network/config/netifd \
            package/kernel/mac80211 \
            2>/dev/null \
            || true

      # ==========================================================
      # 7. 检查 netifd prepare
      # ==========================================================
      - name: "🧪 准备 Netifd 源码"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${LEDE_DIR}"

          echo
          echo "=========================================="
          echo "执行 netifd prepare"
          echo "=========================================="

          make package/network/config/netifd/prepare V=s

          echo
          echo "=========================================="
          echo "寻找准备后的 netifd"
          echo "=========================================="

          find build_dir \
            -type f \
            -name 'netifd-wireless.sh' \
            2>/dev/null \
            | sort \
            || true

      # ==========================================================
      # 8. 检查 toolchain，不编译
      # ==========================================================
      - name: "🧰 检查 Toolchain 状态"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${LEDE_DIR}"

          echo
          echo "=========================================="
          echo "Toolchain"
          echo "=========================================="

          find staging_dir \
            -maxdepth 2 \
            -type d \
            -name 'toolchain-*' \
            | sort \
            || true

          TOOLCHAIN_DIR="$(find staging_dir \
            -maxdepth 2 \
            -type d \
            -name 'toolchain-*' \
            | head -1 || true)"

          if [ -n "${TOOLCHAIN_DIR}" ]; then
            echo
            echo "TOOLCHAIN_DIR=${TOOLCHAIN_DIR}"

            echo
            echo "lib 目录："

            ls -lah \
              "${TOOLCHAIN_DIR}/lib" \
              2>/dev/null \
              || true

            echo
            echo "musl linker："

            find "${TOOLCHAIN_DIR}" \
              -type f \
              \( -name 'ld-musl-*' -o -name 'ld-musl-*.so*' \) \
              2>/dev/null \
              | sort \
              || true
          fi

      # ==========================================================
      # 9. 检查历史构建产物
      # ==========================================================
      - name: "📦 检查现有 Netifd IPK"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${LEDE_DIR}"

          echo
          echo "=========================================="
          echo "现有 netifd IPK"
          echo "=========================================="

          find bin staging_dir tmp build_dir \
            -type f \
            \( \
              -name 'netifd_*.ipk' \
              -o -name '*netifd*.ipk' \
            \) \
            2>/dev/null \
            | sort \
            || true

      # ==========================================================
      # 10. 检查 staging 中是否已经存在脚本
      # ==========================================================
      - name: "🔍 检查 staging 中的最终文件"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${LEDE_DIR}"

          echo
          echo "=================================================="
          echo "staging 中的 netifd-wireless.sh"
          echo "=================================================="

          find staging_dir \
            -type f \
            -path '*/lib/netifd/netifd-wireless.sh' \
            2>/dev/null \
            | sort \
            || true

          echo
          echo "=================================================="
          echo "staging 中的 netifd"
          echo "=================================================="

          find staging_dir \
            -type f \
            -path '*/sbin/netifd' \
            2>/dev/null \
            | sort \
            || true

      # ==========================================================
      # 11. 检查最终 package 目录
      # ==========================================================
      - name: "📂 检查 package 目录"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${LEDE_DIR}"

          echo
          echo "=================================================="
          echo "所有 netifd package 目录"
          echo "=================================================="

          find bin staging_dir tmp \
            -type d \
            \( \
              -iname '*netifd*' \
              -o \
              -path '*netifd*' \
            \) \
            2>/dev/null \
            | head -300 \
            || true

      # ==========================================================
      # 12. 最终判断
      # ==========================================================
      - name: "🎯 输出最终诊断"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${LEDE_DIR}"

          echo
          echo "=================================================="
          echo "🎯 NETIFD 最终诊断"
          echo "=================================================="

          echo
          echo "【A】源码是否存在："

          if find build_dir \
            -type f \
            -name 'netifd-wireless.sh' \
            2>/dev/null \
            | grep -q .; then
            echo "✅ YES"
          else
            echo "❌ NO"
          fi

          echo
          echo "【B】netifd Makefile 是否明确安装："

          if grep -q \
            'netifd-wireless.sh' \
            package/network/config/netifd/Makefile; then
            echo "✅ YES"
          else
            echo "❌ NO"
          fi

          echo
          echo "【C】staging 是否已有最终文件："

          if find staging_dir \
            -type f \
            -path '*/lib/netifd/netifd-wireless.sh' \
            2>/dev/null \
            | grep -q .; then
            echo "✅ YES"
          else
            echo "❌ NO"
          fi

          echo
          echo "【D】现有 IPK 是否存在："

          if find bin staging_dir tmp \
            -type f \
            -name 'netifd_*.ipk' \
            2>/dev/null \
            | grep -q .; then
            echo "✅ YES"
          else
            echo "❌ NO"
          fi

          echo
          echo "=================================================="
          echo "本诊断不会执行 netifd compile"
          echo "不会主动触发 toolchain 编译"
          echo "=================================================="
