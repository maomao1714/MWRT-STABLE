name: MWRT配置诊断

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: 开始诊断
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential gawk gettext libncurses5-dev libssl-dev rsync unzip python3-distutils

          git clone --depth=1 https://github.com/coolsnowwolf/lede.git lede

          cd lede

          cp ../wh3000pro.config .config

          mkdir -p .diag

          echo "================================"
          echo "① 原始配置"
          echo "================================"
          cp .config .diag/0-original

          grep -E '^CONFIG_PACKAGE_(luci-theme-design|luci-app-design-config|docker|dockerd|luci-app-dockerman|lucky|luci-app-lucky|kmod-mt7915e|kmod-mt7981-firmware|mt7981-wo-firmware|qmodem|luci-app-qmodem-next)=' .config || true

          echo "================================"
          echo "② DIY1"
          echo "================================"
          bash ../diy-part1.sh || true
          cp .config .diag/1-diy1

          grep -E '^CONFIG_PACKAGE_(luci-theme-design|luci-app-design-config|docker|dockerd|luci-app-dockerman|lucky|luci-app-lucky|kmod-mt7915e|kmod-mt7981-firmware|mt7981-wo-firmware|qmodem|luci-app-qmodem-next)=' .config || true

          echo "================================"
          echo "③ FEEDS"
          echo "================================"
          ./scripts/feeds update -a || true
          ./scripts/feeds install -a || true
          ./scripts/feeds update qmodem || true
          ./scripts/feeds install -a -p qmodem || true
          cp .config .diag/2-feeds

          grep -E '^CONFIG_PACKAGE_(luci-theme-design|luci-app-design-config|docker|dockerd|luci-app-dockerman|lucky|luci-app-lucky|kmod-mt7915e|kmod-mt7981-firmware|mt7981-wo-firmware|qmodem|luci-app-qmodem-next)=' .config || true

          echo "================================"
          echo "④ DIY2"
          echo "================================"
          DEVICE=wh3000pro bash ../diy-part2.sh || true
          cp .config .diag/3-diy2

          grep -E '^CONFIG_PACKAGE_(luci-theme-design|luci-app-design-config|docker|dockerd|luci-app-dockerman|lucky|luci-app-lucky|kmod-mt7915e|kmod-mt7981-firmware|mt7981-wo-firmware|qmodem|luci-app-qmodem-next)=' .config || true

          echo "================================"
          echo "⑤ QMODEM"
          echo "================================"
          sed -i '/^CONFIG_PACKAGE_qmodem=/d' .config
          sed -i '/^CONFIG_PACKAGE_luci-app-qmodem-next=/d' .config
          sed -i '/^CONFIG_PACKAGE_sms-forwarder-next=/d' .config
          sed -i '/^CONFIG_PACKAGE_quectel-CM-5G-M=/d' .config

          echo 'CONFIG_PACKAGE_qmodem=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-qmodem-next=y' >> .config
          echo 'CONFIG_PACKAGE_sms-forwarder-next=y' >> .config
          echo 'CONFIG_PACKAGE_quectel-CM-5G-M=y' >> .config

          cp .config .diag/4-qmodem

          grep -E '^CONFIG_PACKAGE_(luci-theme-design|luci-app-design-config|docker|dockerd|luci-app-dockerman|lucky|luci-app-lucky|kmod-mt7915e|kmod-mt7981-firmware|mt7981-wo-firmware|qmodem|luci-app-qmodem-next)=' .config || true

          echo "================================"
          echo "⑥ DEFCONFIG"
          echo "================================"
          make defconfig || true
          cp .config .diag/5-defconfig

          grep -E '^CONFIG_PACKAGE_(luci-theme-design|luci-app-design-config|docker|dockerd|luci-app-dockerman|lucky|luci-app-lucky|kmod-mt7915e|kmod-mt7981-firmware|mt7981-wo-firmware|qmodem|luci-app-qmodem-next)=' .config || true

          echo "================================"
          echo "诊断完成"
          echo "================================"

          echo "各阶段文件："
          ls -lh .diag
