name: "🔬 MWRT-STABLE 配置根因诊断"

on:
  workflow_dispatch:
    inputs:
      device:
        description: "选择诊断设备"
        required: true
        type: choice
        options:
          - wh3000
          - wh3000pro
          - re-sp-01b
        default: wh3000pro

      kernel:
        description: "选择内核"
        required: true
        type: choice
        options:
          - "6.6"
          - "latest"
        default: "latest"

permissions:
  contents: read

env:
  LEDE_REPO: "https://github.com/coolsnowwolf/lede.git"
  LEDE_BRANCH: "master"
  LEDE_DIR: "openwrt"
  TZ: "Asia/Shanghai"

jobs:
  diagnose:
    name: "${{ inputs.device }} / Linux ${{ inputs.kernel }} / 配置诊断"
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:

      - name: "📥 Checkout MWRT"
        uses: actions/checkout@v4

      - name: "💽 Runner 状态"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "🔬 MWRT-STABLE 配置根因诊断"
          echo "=========================================="

          echo
          echo "Device : ${{ inputs.device }}"
          echo "Kernel : ${{ inputs.kernel }}"
          echo "Runner : $(uname -a)"

          echo
          echo "===== 磁盘 ====="
          df -h

          echo
          echo "===== 内存 ====="
          free -h

          echo
          echo "===== CPU ====="
          nproc

      - name: "🧰 安装基础依赖"
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl

      - name: "📥 获取 LEDE"
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf "${LEDE_DIR}"

          git clone \
            --depth=1 \
            --single-branch \
            --branch "${LEDE_BRANCH}" \
            "${LEDE_REPO}" \
            "${LEDE_DIR}"

          cd "${LEDE_DIR}"

          LEDE_COMMIT="$(git rev-parse HEAD)"

          echo "LEDE_COMMIT=${LEDE_COMMIT}" >> "${GITHUB_ENV}"

          echo
          echo "=========================================="
          echo "📥 LEDE 源码"
          echo "=========================================="

          echo "Repository : ${LEDE_REPO}"
          echo "Branch     : ${LEDE_BRANCH}"
          echo "Commit     : ${LEDE_COMMIT}"

          echo
          git log -1 --oneline

      - name: "🔎 检查基础文件"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "🔎 MWRT 基础文件检查"
          echo "=========================================="

          for f in \
            "${GITHUB_WORKSPACE}/diy-part1.sh" \
            "${GITHUB_WORKSPACE}/diy-part2.sh" \
            "${GITHUB_WORKSPACE}/wh3000.config" \
            "${GITHUB_WORKSPACE}/wh3000pro.config" \
            "${GITHUB_WORKSPACE}/re-sp-01b.config"
          do

            if [ ! -f "${f}" ]; then
              echo "❌ 缺少文件：${f}"
              exit 1
            fi

            echo "✅ ${f}"

          done

      - name: "📦 [01] 加载设备 .config"
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${LEDE_DIR}"

          case "${{ inputs.device }}" in

            wh3000)
              CONFIG_FILE="${GITHUB_WORKSPACE}/wh3000.config"
              ;;

            wh3000pro)
              CONFIG_FILE="${GITHUB_WORKSPACE}/wh3000pro.config"
              ;;

            re-sp-01b)
              CONFIG_FILE="${GITHUB_WORKSPACE}/re-sp-01b.config"
              ;;

            *)
              echo "❌ 未知设备"
              exit 1
              ;;

          esac

          if [ ! -f "${CONFIG_FILE}" ]; then
            echo "❌ 找不到配置文件：${CONFIG_FILE}"
            exit 1
          fi

          echo "CONFIG_FILE=${CONFIG_FILE}" >> "${GITHUB_ENV}"

          cp "${CONFIG_FILE}" .config

          echo
          echo "=========================================="
          echo "📦 [01] 原始设备配置"
          echo "=========================================="

          echo "Device : ${{ inputs.device }}"
          echo "Config : ${CONFIG_FILE}"

          echo
          echo "===== TARGET ====="

          grep '^CONFIG_TARGET_' .config || true

          echo
          echo "===== Kernel ====="

          grep -E \
            '^CONFIG_(LINUX_|TESTING_KERNEL)' \
            .config || true

          echo
          echo "===== Design / Docker / Lucky / Wi-Fi ====="

          grep -E \
            '^CONFIG_PACKAGE_(luci-theme-design|luci-app-design-config|docker|dockerd|containerd|runc|tini|luci-app-dockerman|dockerd-compose|cgroupfs-mount|lucky|luci-app-lucky|wifi-scripts|kmod-mac80211|kmod-cfg80211|kmod-mt76-core|kmod-mt76-connac|kmod-mt7915e|kmod-mt7981-firmware|mt7981-wo-firmware|wireless-regdb|iwinfo|rpcd-mod-iwinfo|wpad-openssl-mbedtls|wpad-openssl)=' \
            .config || true
                  - name: "🐧 [02] Kernel 基线与策略"
        shell: bash
        run: |
          set -e

          cd "${LEDE_DIR}"

          echo "========================================"
          echo "🐧 Kernel 基线与策略"
          echo "========================================"

          echo "当前内核相关配置："
          grep -E \
            '^(CONFIG_TESTING_KERNEL|CONFIG_LINUX_6_1|CONFIG_LINUX_6_6|CONFIG_LINUX_6_12|CONFIG_LINUX_6_18)=' \
            .config || true

          echo
          echo "执行与正式 mwrt-stable.yml 相同的 Kernel 策略..."

          sed -i \
            -e '/^CONFIG_TESTING_KERNEL=/d' \
            -e '/^CONFIG_LINUX_6_1=/d' \
            -e '/^CONFIG_LINUX_6_6=/d' \
            -e '/^CONFIG_LINUX_6_12=/d' \
            -e '/^CONFIG_LINUX_6_18=/d' \
            .config

          echo '# CONFIG_TESTING_KERNEL is not set' >> .config

          if [ "${{ inputs.kernel }}" = "6.6" ]; then
            echo "CONFIG_LINUX_6_6=y" >> .config
          else
            echo "使用当前源码默认/最新稳定内核策略"
          fi

          echo
          echo "Kernel 策略执行后："
          grep -E \
            '^(CONFIG_TESTING_KERNEL|CONFIG_LINUX_6_1|CONFIG_LINUX_6_6|CONFIG_LINUX_6_12|CONFIG_LINUX_6_18)=' \
            .config || true


      - name: "🧩 [03] 执行真实 DIY1"
        shell: bash
        run: |
          set -e

          cd "${LEDE_DIR}"

          echo "========================================"
          echo "🧩 执行仓库中的真实 diy-part1.sh"
          echo "========================================"

          if [ ! -f ../diy-part1.sh ]; then
            echo "❌ 找不到 diy-part1.sh"
            exit 1
          fi

          echo "DIY1 行数："
          wc -l ../diy-part1.sh

          echo
          echo "开始执行："
          bash ../diy-part1.sh

          echo
          echo "✅ DIY1 执行完成"


      - name: "🔎 [04] DIY1 后配置快照"
        shell: bash
        run: |
          set +e

          cd "${LEDE_DIR}"

          echo "========================================"
          echo "🔎 DIY1 后关键配置状态"
          echo "========================================"

          echo
          echo "【Design】"
          grep -E \
            '^CONFIG_PACKAGE_(luci-theme-design|luci-app-design-config)=' \
            .config || echo "⚠️ Design 配置不存在"

          echo
          echo "【Docker】"
          grep -E \
            '^CONFIG_PACKAGE_(docker|dockerd|containerd|runc|tini|luci-app-dockerman|dockerd-compose|cgroupfs-mount)=' \
            .config || echo "⚠️ Docker 配置不存在"

          echo
          echo "【Lucky】"
          grep -E \
            '^CONFIG_PACKAGE_(lucky|luci-app-lucky)=' \
            .config || echo "⚠️ Lucky 配置不存在"

          echo
          echo "【WH3000 / MT7981 Wi-Fi】"
          grep -E \
            '^CONFIG_PACKAGE_(kmod-mac80211|kmod-cfg80211|kmod-mt76-core|kmod-mt76-connac|kmod-mt7915e|kmod-mt7981-firmware|mt7981-wo-firmware|wireless-regdb|iwinfo|rpcd-mod-iwinfo)=' \
            .config || echo "⚠️ Wi-Fi 关键配置不存在"

          echo
          echo "【QModem】"
          grep -E \
            '^CONFIG_PACKAGE_(qmodem|luci-app-qmodem-next|sms-forwarder-next|quectel-CM-5G-M)=' \
            .config || echo "⚠️ QModem 当前尚未配置"

          echo
          echo "========================================"
          echo "DIY1 后配置快照结束"
          echo "========================================"


      - name: "📡 [05] 更新并安装真实 feeds"
        shell: bash
        run: |
          set -e

          cd "${LEDE_DIR}"

          echo "========================================"
          echo "📡 执行真实 mwrt-stable.yml 的 feeds 操作"
          echo "========================================"

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          ./scripts/feeds update qmodem
          ./scripts/feeds install -a -p qmodem

          echo
          echo "========================================"
          echo "feeds 状态"
          echo "========================================"

          ./scripts/feeds list


      - name: "🔎 [06] feeds 后源码与配置检查"
        shell: bash
        run: |
          set +e

          cd "${LEDE_DIR}"

          echo "========================================"
          echo "🔎 feeds 安装完成后的关键检查"
          echo "========================================"

          echo
          echo "【Design 源码】"
          find package feeds \
            -maxdepth 5 \
            -type d \
            \( -iname '*luci-theme-design*' -o -iname '*design-config*' \) \
            2>/dev/null | head -50

          echo
          echo "【Docker 源码】"
          find package feeds \
            -maxdepth 5 \
            -type d \
            \( -iname 'docker' -o -iname 'dockerd' -o -iname '*dockerman*' \) \
            2>/dev/null | head -50

          echo
          echo "【Lucky 源码】"
          find package feeds \
            -maxdepth 5 \
            -type d \
            -iname '*lucky*' \
            2>/dev/null | head -50

          echo
          echo "【QModem 源码】"
          find package feeds \
            -maxdepth 6 \
            -type d \
            -iname '*qmodem*' \
            2>/dev/null | head -50

          echo
          echo "【MT7915 / mt76 源码】"
          find package target \
            -maxdepth 8 \
            -type f \
            \( -iname '*mt7915*' -o -iname '*mt76*' \) \
            2>/dev/null | head -80

          echo
          echo "========================================"
          echo "feeds 后检查结束"
          echo "========================================"
          
      - name: "🛠️ [07] 执行真实 DIY2"
        shell: bash
        run: |
          set -e
          cd "${LEDE_DIR}"

          echo "========================================"
          echo "🛠️ 执行真实 diy-part2.sh"
          echo "========================================"

          if [ ! -f ../diy-part2.sh ]; then
            echo "❌ 找不到 diy-part2.sh"
            exit 1
          fi

          echo "DIY2 文件行数："
          wc -l ../diy-part2.sh

          echo
          echo "开始执行 DIY2..."

          DEVICE="${{ inputs.device }}" bash ../diy-part2.sh

          echo
          echo "✅ DIY2 执行完成"


      - name: "🔎 [08] DIY2 后关键配置快照"
        shell: bash
        run: |
          set +e
          cd "${LEDE_DIR}"

          echo "========================================"
          echo "🔎 DIY2 后关键配置"
          echo "========================================"

          echo
          echo "【Design】"
          grep -E '^CONFIG_PACKAGE_(luci-theme-design|luci-app-design-config)=' .config
          if [ $? -ne 0 ]; then
            echo "❌ Design 配置不存在"
          fi

          echo
          echo "【Docker】"
          grep -E '^CONFIG_PACKAGE_(docker|dockerd|containerd|runc|tini|luci-app-dockerman|dockerd-compose|cgroupfs-mount)=' .config
          if [ $? -ne 0 ]; then
            echo "❌ Docker 配置不存在"
          fi

          echo
          echo "【Lucky】"
          grep -E '^CONFIG_PACKAGE_(lucky|luci-app-lucky)=' .config
          if [ $? -ne 0 ]; then
            echo "❌ Lucky 配置不存在"
          fi

          echo
          echo "【MT7981 / MT7915 Wi-Fi】"
          grep -E '^CONFIG_PACKAGE_(kmod-mac80211|kmod-cfg80211|kmod-mt76-core|kmod-mt76-connac|kmod-mt7915e|kmod-mt7981-firmware|mt7981-wo-firmware|wireless-regdb|iwinfo|rpcd-mod-iwinfo)=' .config
          if [ $? -ne 0 ]; then
            echo "❌ Wi-Fi 关键配置不存在"
          fi

          echo
          echo "【QModem】"
          grep -E '^CONFIG_PACKAGE_(qmodem|luci-app-qmodem-next|sms-forwarder-next|quectel-CM-5G-M)=' .config
          if [ $? -ne 0 ]; then
            echo "ℹ️ QModem 当前尚未配置"
          fi

          echo
          echo "========================================"
          echo "DIY2 后配置检查完成"
          echo "========================================"


      - name: "📡 [09] 配置真实 QModem"
        shell: bash
        run: |
          set -e
          cd "${LEDE_DIR}"

          echo "========================================"
          echo "📡 配置 QModem"
          echo "========================================"

          sed -i \
            -e '/^CONFIG_PACKAGE_qmodem=/d' \
            -e '/^CONFIG_PACKAGE_luci-app-qmodem=/d' \
            -e '/^CONFIG_PACKAGE_luci-app-qmodem-next=/d' \
            -e '/^CONFIG_PACKAGE_qmodem-sipd=/d' \
            -e '/^CONFIG_PACKAGE_qmodem-voip=/d' \
            -e '/^CONFIG_PACKAGE_luci-app-qmodem-sms=/d' \
            -e '/^CONFIG_PACKAGE_luci-app-qmodem-ttl=/d' \
            -e '/^CONFIG_PACKAGE_sms-forwarder-next=/d' \
            -e '/^CONFIG_PACKAGE_quectel-CM-5G-M=/d' \
            .config

          cat >> .config <<'EOF'
CONFIG_PACKAGE_qmodem=y
CONFIG_PACKAGE_luci-app-qmodem-next=y
CONFIG_PACKAGE_sms-forwarder-next=y
CONFIG_PACKAGE_quectel-CM-5G-M=y
EOF

          echo
          echo "QModem 配置结果："

          grep -E '^CONFIG_PACKAGE_(qmodem|luci-app-qmodem-next|sms-forwarder-next|quectel-CM-5G-M)=' .config

          echo
          echo "✅ QModem 配置完成"


      - name: "🔎 [10] QModem 后关键配置"
        shell: bash
        run: |
          set +e
          cd "${LEDE_DIR}"

          echo "========================================"
          echo "🔎 QModem 后关键配置检查"
          echo "========================================"

          echo
          echo "【Design】"
          grep -E '^CONFIG_PACKAGE_(luci-theme-design|luci-app-design-config)=' .config || echo "❌ Design 已不存在"

          echo
          echo "【Docker】"
          grep -E '^CONFIG_PACKAGE_(docker|dockerd|containerd|runc|tini|luci-app-dockerman|dockerd-compose|cgroupfs-mount)=' .config || echo "❌ Docker 已不存在"

          echo
          echo "【Lucky】"
          grep -E '^CONFIG_PACKAGE_(lucky|luci-app-lucky)=' .config || echo "❌ Lucky 已不存在"

          echo
          echo "【Wi-Fi】"
          grep -E '^CONFIG_PACKAGE_(kmod-mac80211|kmod-cfg80211|kmod-mt76-core|kmod-mt76-connac|kmod-mt7915e|kmod-mt7981-firmware|mt7981-wo-firmware|wireless-regdb|iwinfo|rpcd-mod-iwinfo)=' .config || echo "❌ Wi-Fi 关键配置已不存在"

          echo
          echo "【QModem】"
          grep -E '^CONFIG_PACKAGE_(qmodem|luci-app-qmodem-next|sms-forwarder-next|quectel-CM-5G-M)=' .config || echo "❌ QModem 配置异常"

          echo
          echo "========================================"
          echo "QModem 后检查完成"
          echo "========================================"


          - name: "🌐 [11] 配置通用 WWAN"
          shell: bash
          run: |
          set -e
          cd "${LEDE_DIR}"

          echo "========================================"
          echo "🌐 配置通用 WWAN"
          echo "========================================"

          find_pkg() {
            local pkg="$1"

            if find package feeds \
              -type f \
              \( -name "Makefile" -o -name "*.mk" \) \
              -print0 2>/dev/null \
              | xargs -0 grep -l "Package/${pkg}" 2>/dev/null \
              | head -1 \
              | grep -q .; then
              return 0
            fi

            return 1
          }

          for pkg in \
            kmod-usb-net \
            kmod-usb-net-cdc-ether \
            kmod-usb-net-cdc-mbim \
            kmod-usb-net-cdc-ncm \
            kmod-usb-net-rndis \
            kmod-usb-net-qmi-wwan \
            kmod-usb-serial \
            kmod-usb-serial-option \
            kmod-usb-serial-wwan \
            kmod-usb-serial-qualcomm \
            kmod-usb-serial-sierra \
            kmod-usb-wdm \
            kmod-qmi_wwan \
            kmod-qmi_wwan_f \
            kmod-qmi_wwan_q \
            kmod-qmi_wwan_s \
            kmod-ppp \
            ppp \
            ppp-mod-pppoe \
            kmod-mhi-bus \
            kmod-mhi-net \
            kmod-mhi-pci \
            kmod-mhi-pci-generic \
            kmod-mhi-wwan \
            kmod-mhi-wwan-ctrl \
            kmod-mhi-wwan-mbim
          do
            if find_pkg "${pkg}"; then
              sed -i "/^CONFIG_PACKAGE_${pkg}=/d" .config
              echo "CONFIG_PACKAGE_${pkg}=m" >> .config
              echo "✅ ${pkg}=m"
            else
              echo "ℹ️ 未找到 ${pkg}"
            fi
          done

          echo
          echo "========================================"
          echo "WWAN 配置完成"
          echo "========================================"
                - name: "🔍 [12] make defconfig 前最终快照"
        shell: bash
        run: |
          set +e
          cd "${LEDE_DIR}"

          echo "========================================"
          echo "🔍 make defconfig 前最终配置"
          echo "========================================"

          echo
          echo "【TARGET】"
          grep -E '^CONFIG_TARGET_(mediatek|ramips)=' .config

          echo
          echo "【DEVICE】"
          grep -E '^CONFIG_TARGET_.*DEVICE_.*=' .config

          echo
          echo "【Kernel】"
          grep -E '^CONFIG_(TESTING_KERNEL|LINUX_6_1|LINUX_6_6|LINUX_6_12|LINUX_6_18)=' .config

          echo
          echo "【Design】"
          grep -E '^CONFIG_PACKAGE_(luci-theme-design|luci-app-design-config)=' .config || echo "❌ Design 缺失"

          echo
          echo "【Docker】"
          grep -E '^CONFIG_PACKAGE_(docker|dockerd|containerd|runc|tini|luci-app-dockerman|dockerd-compose|cgroupfs-mount)=' .config || echo "❌ Docker 缺失"

          echo
          echo "【Lucky】"
          grep -E '^CONFIG_PACKAGE_(lucky|luci-app-lucky)=' .config || echo "❌ Lucky 缺失"

          echo
          echo "【Wi-Fi】"
          grep -E '^CONFIG_PACKAGE_(kmod-mac80211|kmod-cfg80211|kmod-mt76-core|kmod-mt76-connac|kmod-mt7915e|kmod-mt7981-firmware|mt7981-wo-firmware|wireless-regdb|iwinfo|rpcd-mod-iwinfo)=' .config || echo "❌ Wi-Fi 关键配置缺失"

          echo
          echo "【QModem】"
          grep -E '^CONFIG_PACKAGE_(qmodem|luci-app-qmodem-next|sms-forwarder-next|quectel-CM-5G-M)=' .config || echo "❌ QModem 缺失"

          echo
          echo "========================================"
          echo "make defconfig 前快照完成"
          echo "========================================"


          - name: "⚙️ [13] 执行 make defconfig"
          shell: bash
          run: |
          set -e
          cd "${LEDE_DIR}"

          echo "========================================"
          echo "⚙️ 执行 make defconfig"
          echo "========================================"

          make defconfig

          echo
          echo "✅ make defconfig 执行完成"


          - name: "🚨 [14] defconfig 后最终根因结果"
          shell: bash
          run: |
          set +e
          cd "${LEDE_DIR}"

          echo
          echo "================================================"
          echo "🚨 MWRT-STABLE 配置根因诊断最终结果"
          echo "================================================"

          echo
          echo "【1. TARGET】"
          grep -E '^CONFIG_TARGET_(mediatek|ramips)=' .config || true
          grep -E '^CONFIG_TARGET_.*DEVICE_.*=' .config || true

          echo
          echo "【2. Kernel】"
          grep -E '^CONFIG_(TESTING_KERNEL|LINUX_6_1|LINUX_6_6|LINUX_6_12|LINUX_6_18)=' .config || true

          echo
          echo "【3. Design】"
          if grep -q '^CONFIG_PACKAGE_luci-theme-design=y' .config; then
            echo "✅ luci-theme-design=y"
          else
            echo "❌ luci-theme-design 最终不是 y"
          fi

          if grep -q '^CONFIG_PACKAGE_luci-app-design-config=y' .config; then
            echo "✅ luci-app-design-config=y"
          else
            echo "❌ luci-app-design-config 最终不是 y"
          fi

          echo
          echo "【4. Docker】"
          for pkg in \
            docker \
            dockerd \
            containerd \
            runc \
            tini \
            luci-app-dockerman \
            dockerd-compose \
            cgroupfs-mount
          do
            grep -q "^CONFIG_PACKAGE_${pkg}=y" .config
            if [ $? -eq 0 ]; then
              echo "✅ ${pkg}=y"
            else
              echo "❌ ${pkg} 最终不是 y"
            fi
          done

          echo
          echo "【5. Lucky】"
          for pkg in lucky luci-app-lucky
          do
            grep -q "^CONFIG_PACKAGE_${pkg}=y" .config
            if [ $? -eq 0 ]; then
              echo "✅ ${pkg}=y"
            else
              echo "❌ ${pkg} 最终不是 y"
            fi
          done

          echo
          echo "【6. MT7981 / MT7915 Wi-Fi】"
          for pkg in \
            kmod-mac80211 \
            kmod-cfg80211 \
            kmod-mt76-core \
            kmod-mt76-connac \
            kmod-mt7915e \
            kmod-mt7981-firmware \
            mt7981-wo-firmware \
            wireless-regdb \
            iwinfo \
            rpcd-mod-iwinfo
          do
            grep -q "^CONFIG_PACKAGE_${pkg}=y" .config
            if [ $? -eq 0 ]; then
              echo "✅ ${pkg}=y"
            else
              echo "❌ ${pkg} 最终不是 y"
            fi
          done

          echo
          echo "【7. QModem】"
          for pkg in \
            qmodem \
            luci-app-qmodem-next \
            sms-forwarder-next \
            quectel-CM-5G-M
          do
            grep -q "^CONFIG_PACKAGE_${pkg}=y" .config
            if [ $? -eq 0 ]; then
              echo "✅ ${pkg}=y"
            else
              echo "❌ ${pkg} 最终不是 y"
            fi
          done

          echo
          echo "【8. WWAN】"
          for pkg in \
            kmod-usb-net \
            kmod-usb-net-cdc-ether \
            kmod-usb-net-cdc-mbim \
            kmod-usb-net-cdc-ncm \
            kmod-usb-net-rndis \
            kmod-usb-net-qmi-wwan \
            kmod-usb-serial \
            kmod-usb-serial-option \
            kmod-usb-serial-wwan \
            kmod-usb-wdm \
            kmod-qmi_wwan \
            kmod-ppp \
            ppp \
            ppp-mod-pppoe \
            kmod-mhi-bus \
            kmod-mhi-net \
            kmod-mhi-pci \
            kmod-mhi-pci-generic \
            kmod-mhi-wwan \
            kmod-mhi-wwan-ctrl \
            kmod-mhi-wwan-mbim
          do
            grep -q "^CONFIG_PACKAGE_${pkg}=" .config
            if [ $? -eq 0 ]; then
              grep "^CONFIG_PACKAGE_${pkg}=" .config
            else
              echo "⚠️ ${pkg} 未进入最终 .config"
            fi
          done

          echo
          echo "================================================"
          echo "📋 最终 .config 中相关项目汇总"
          echo "================================================"

          grep -E \
            '^CONFIG_PACKAGE_(luci-theme-design|luci-app-design-config|docker|dockerd|containerd|runc|tini|luci-app-dockerman|dockerd-compose|cgroupfs-mount|lucky|luci-app-lucky|kmod-mac80211|kmod-cfg80211|kmod-mt76-core|kmod-mt76-connac|kmod-mt7915e|kmod-mt7981-firmware|mt7981-wo-firmware|wireless-regdb|iwinfo|rpcd-mod-iwinfo|qmodem|luci-app-qmodem-next|sms-forwarder-next|quectel-CM-5G-M)=' \
            .config || true

          echo
          echo "================================================"
          echo "🧠 根因判断提示"
          echo "================================================"

          echo "如果某项目："
          echo "  ① 原始设备 config 有"
          echo "  ② DIY1 后消失"
          echo "     → 重点检查 DIY1"
          echo
          echo "  ③ DIY1 后存在，feeds 后消失"
          echo "     → 重点检查 feeds / Package 定义"
          echo
          echo "  ④ feeds 后存在，DIY2 后消失"
          echo "     → 重点检查 DIY2"
          echo
          echo "  ⑤ DIY2 后存在，QModem 后消失"
          echo "     → 重点检查 QModem 配置逻辑"
          echo
          echo "  ⑥ QModem 后存在，defconfig 后变成非 y"
          echo "     → 重点检查 Kconfig 依赖关系"
          echo
          echo "  ⑦ defconfig 后仍然存在，但刷机后功能不存在"
          echo "     → 不再是 .config 丢失问题，应继续检查"
          echo "       DTS / EEPROM / 固件 / 驱动加载 / 启动日志"
          echo
          echo "================================================"
          echo "🔬 诊断结束"
          echo "================================================"
