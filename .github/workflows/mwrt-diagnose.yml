name: MWRT Feeds 精确测试

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Feeds 精确测试
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential gawk gettext libncurses5-dev libssl-dev rsync unzip python3-distutils

          git clone --depth=1 https://github.com/coolsnowwolf/lede.git lede

          cd lede

          cp ../wh3000pro.config .config

          mkdir -p .diag

          echo "================================"
          echo "① 原始配置"
          echo "================================"

          cp .config .diag/0-original

          grep -E '^CONFIG_PACKAGE_(luci-theme-design|luci-app-design-config|docker|dockerd|containerd|luci-app-dockerman|lucky|luci-app-lucky|kmod-mt7915e|kmod-mt7981-firmware|mt7981-wo-firmware|qmodem|luci-app-qmodem-next)=' .config || true

          echo "================================"
          echo "② DIY1"
          echo "================================"

          bash ../diy-part1.sh || true

          cp .config .diag/1-diy1

          grep -E '^CONFIG_PACKAGE_(luci-theme-design|luci-app-design-config|docker|dockerd|containerd|luci-app-dockerman|lucky|luci-app-lucky|kmod-mt7915e|kmod-mt7981-firmware|mt7981-wo-firmware|qmodem|luci-app-qmodem-next)=' .config || true

          echo "================================"
          echo "③ 只执行 feeds update -a"
          echo "================================"

          ./scripts/feeds update -a || true

          cp .config .diag/2-update

          grep -E '^CONFIG_PACKAGE_(luci-theme-design|luci-app-design-config|docker|dockerd|containerd|luci-app-dockerman|lucky|luci-app-lucky|kmod-mt7915e|kmod-mt7981-firmware|mt7981-wo-firmware|qmodem|luci-app-qmodem-next)=' .config || true

          echo "================================"
          echo "④ 只执行 feeds install -a"
          echo "================================"

          ./scripts/feeds install -a || true

          cp .config .diag/3-install

          grep -E '^CONFIG_PACKAGE_(luci-theme-design|luci-app-design-config|docker|dockerd|containerd|luci-app-dockerman|lucky|luci-app-lucky|kmod-mt7915e|kmod-mt7981-firmware|mt7981-wo-firmware|qmodem|luci-app-qmodem-next)=' .config || true

          echo "================================"
          echo "⑤ 只执行 qmodem update"
          echo "================================"

          ./scripts/feeds update qmodem || true

          cp .config .diag/4-qmodem-update

          grep -E '^CONFIG_PACKAGE_(luci-theme-design|luci-app-design-config|docker|dockerd|containerd|luci-app-dockerman|lucky|luci-app-lucky|kmod-mt7915e|kmod-mt7981-firmware|mt7981-wo-firmware|qmodem|luci-app-qmodem-next)=' .config || true

          echo "================================"
          echo "⑥ 只执行 qmodem install"
          echo "================================"

          ./scripts/feeds install -a -p qmodem || true

          cp .config .diag/5-qmodem-install

          grep -E '^CONFIG_PACKAGE_(luci-theme-design|luci-app-design-config|docker|dockerd|containerd|luci-app-dockerman|lucky|luci-app-lucky|kmod-mt7915e|kmod-mt7981-firmware|mt7981-wo-firmware|qmodem|luci-app-qmodem-next)=' .config || true

          echo "================================"
          echo "最终对比"
          echo "================================"

          for f in .diag/*; do
            echo
            echo "---------- $f ----------"
            grep -E '^CONFIG_PACKAGE_(luci-theme-design|luci-app-design-config|docker|dockerd|containerd|luci-app-dockerman|lucky|luci-app-lucky|kmod-mt7915e|kmod-mt7981-firmware|mt7981-wo-firmware|qmodem|luci-app-qmodem-next)=' "$f" || true
          done

          echo
          echo "================================"
          echo "测试完成"
          echo "================================"
