name: MWRT Feed最终定位测试

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Feed逐个定位
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential gawk gettext libncurses5-dev libssl-dev rsync unzip python3-distutils

          git clone --depth=1 https://github.com/coolsnowwolf/lede.git lede

          cd lede

          cp ../wh3000pro.config .config

          bash ../diy-part1.sh || true

          echo
          echo "========================================"
          echo "初始状态"
          echo "========================================"

          check_config() {
            echo
            echo "----- 当前配置 -----"

            for x in \
              luci-theme-design \
              luci-app-design-config \
              docker \
              dockerd \
              containerd \
              luci-app-dockerman \
              lucky \
              luci-app-lucky \
              kmod-mt7915e \
              kmod-mt7981-firmware \
              mt7981-wo-firmware \
              qmodem \
              luci-app-qmodem-next
            do
              if grep -q "^CONFIG_PACKAGE_${x}=y$" .config; then
                echo "OK      $x"
              else
                echo "MISSING $x"
              fi
            done
          }

          check_config

          echo
          echo "========================================"
          echo "① packages"
          echo "========================================"

          ./scripts/feeds update packages

          check_config

          echo
          echo "========================================"
          echo "② luci"
          echo "========================================"

          ./scripts/feeds update luci

          check_config

          echo
          echo "========================================"
          echo "③ routing"
          echo "========================================"

          ./scripts/feeds update routing

          check_config

          echo
          echo "========================================"
          echo "④ telephony"
          echo "========================================"

          ./scripts/feeds update telephony

          check_config

          echo
          echo "========================================"
          echo "⑤ helloworld"
          echo "========================================"

          ./scripts/feeds update helloworld

          check_config

          echo
          echo "========================================"
          echo "⑥ lucky"
          echo "========================================"

          ./scripts/feeds update lucky

          check_config

          echo
          echo "========================================"
          echo "⑦ qmodem"
          echo "========================================"

          ./scripts/feeds update qmodem

          check_config

          echo
          echo "========================================"
          echo "⑧ rtp2httpd"
          echo "========================================"

          ./scripts/feeds update rtp2httpd

          check_config

          echo
          echo "========================================"
          echo "最终测试结束"
          echo "========================================"
